name: zz-pipe-diag
# Temporary: which NtCreateNamedPipeFile arguments does the Windows runner's kernel accept?
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/zz-pipe-diag.yml"
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class P {
            [StructLayout(LayoutKind.Sequential)] public struct US { public ushort Length, Max; public IntPtr Buf; }
            [StructLayout(LayoutKind.Sequential)] public struct OA { public int Len; public IntPtr Root; public IntPtr Name; public uint Attr; public IntPtr Sd; public IntPtr Qos; }
            [StructLayout(LayoutKind.Sequential)] public struct IOSB { public IntPtr St; public IntPtr Info; }
            [DllImport("ntdll.dll")] public static extern int NtCreateNamedPipeFile(out IntPtr h, uint access, ref OA oa, out IOSB io,
              uint share, uint disp, uint opts, uint type, uint rmode, uint cmode, uint maxinst, uint inq, uint outq, IntPtr timeout);
            [DllImport("ntdll.dll")] public static extern int NtClose(IntPtr h);
            public static string Try(string name, uint access, uint share, uint disp, uint opts, long? timeout, uint maxinst) {
              IntPtr buf = Marshal.StringToHGlobalUni(name);
              US us = new US(); us.Length = (ushort)(name.Length * 2); us.Max = (ushort)(us.Length + 2); us.Buf = buf;
              IntPtr pus = Marshal.AllocHGlobal(Marshal.SizeOf(typeof(US))); Marshal.StructureToPtr(us, pus, false);
              OA oa = new OA(); oa.Len = Marshal.SizeOf(typeof(OA)); oa.Name = pus; oa.Attr = 0x40;
              IntPtr pt = IntPtr.Zero;
              if (timeout.HasValue) { pt = Marshal.AllocHGlobal(8); Marshal.WriteInt64(pt, timeout.Value); }
              IntPtr h; IOSB io;
              int s = NtCreateNamedPipeFile(out h, access, ref oa, out io, share, disp, opts, 0, 0, 0, maxinst, 4096, 4096, pt);
              if (s >= 0) NtClose(h);
              return s.ToString("x8");
            }
          }
          '@
          $n = "\??\pipe\Win32.Pipes.{0:d8}.{1:d8}" -f $PID, (Get-Random -Maximum 99999999)
          $acc = 0x80100100
          "wine params (timeout 0, FILE_OPEN_IF)   : " + [P]::Try($n, $acc, 2, 3, 0x20, 0, 1)
          "timeout -500000 (50 ms)                 : " + [P]::Try($n + "a", $acc, 2, 3, 0x20, -500000, 1)
          "timeout NULL                            : " + [P]::Try($n + "b", $acc, 2, 3, 0x20, $null, 1)
          "timeout -1200000000, FILE_CREATE        : " + [P]::Try($n + "c", $acc, 2, 2, 0x20, -1200000000, 1)
          "timeout 0, FILE_CREATE                  : " + [P]::Try($n + "d", $acc, 2, 2, 0x20, 0, 1)
          "\Device\NamedPipe name, timeout 0       : " + [P]::Try("\Device\NamedPipe\Win32.Pipes.x$PID", $acc, 2, 3, 0x20, 0, 1)
          "\Device\NamedPipe name, 50 ms           : " + [P]::Try("\Device\NamedPipe\Win32.Pipes.y$PID", $acc, 2, 3, 0x20, -500000, 1)
          "maxinst 2, timeout 0                    : " + [P]::Try($n + "e", $acc, 2, 3, 0x20, 0, 2)
          "access GENERIC_READ|SYNC only, 50 ms    : " + [P]::Try($n + "f", 0x80100000, 2, 3, 0x20, -500000, 1)
