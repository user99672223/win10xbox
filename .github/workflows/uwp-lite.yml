name: uwp-lite

# host-uwp-lite: a THROWAWAY on-console validator for M1 (loader) + M2 (dispatcher).
# This job only BUILDS and PACKAGES it into a .msix (artifact host-uwp-lite-msix);
# running it on an Xbox Series S in Dev Mode is the owner's job, later. It is a
# separate workflow on purpose: ci.yml and its green jobs stay untouched.
#
# Standalone CMake project (host-uwp-lite/CMakeLists.txt) that add_subdirectory()s
# third_party/ and core/; the top-level CMakeLists.txt is not involved. Same
# toolchain recipe as the `windows` job in ci.yml (Ninja + cl + sccache), because
# that is the configuration core/ is known to build in. RelWithDebInfo (O2 +
# NDEBUG) is one of the two configurations ci.yml gates on.

on:
  push:
    branches: ["**"]
    paths:
      - "host-uwp-lite/**"
      - "core/**"
      - "third_party/**"
      - "machine/machine.default.json"
      - ".github/workflows/uwp-lite.yml"
  pull_request:
    paths:
      - "host-uwp-lite/**"
      - "core/**"
      - "third_party/**"
      - "machine/machine.default.json"
      - ".github/workflows/uwp-lite.yml"
  workflow_dispatch:

concurrency:
  group: uwp-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read   # the job downloads the wine-pe-builtin artifact

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Nested submodules we need (zycore only; speakeasy's test corpora are not needed)
        run: git submodule update --init --recursive third_party/zydis
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Wine PE builtins (ntdll/kernelbase/kernel32 and friends) from the latest
      # successful wine-pe run, same incantation as the `windows` job in ci.yml.
      # They are bundled INSIDE the package and copied to LocalState at first run.
      # Non-fatal: without them the package is still produced (the owner can drop
      # the DLLs into LocalState\machine\Windows\builtin on the console).
      - name: Fetch wine-pe builtin DLLs (optional)
        shell: pwsh
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $id = gh run list --repo ${{ github.repository }} --workflow wine-pe.yml --branch ${{ github.ref_name }} --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if (-not $id) {
            $id = gh run list --repo ${{ github.repository }} --workflow wine-pe.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          }
          if ($id) {
            New-Item -ItemType Directory -Force -Path wine-pe/out/builtin | Out-Null
            gh run download $id --repo ${{ github.repository }} --name wine-pe-builtin --dir wine-pe/out/builtin
            Write-Host "downloaded wine-pe-builtin from run $id ($((Get-ChildItem wine-pe/out/builtin -Filter *.dll).Count) DLLs)"
          } else {
            Write-Host "no successful wine-pe run yet; the package will be built WITHOUT the Wine builtins"
          }
          $global:LASTEXITCODE = 0

      - name: Configure
        env: { SCCACHE_GHA_ENABLED: "true" }
        run: >
          cmake -S host-uwp-lite -B build-uwp-lite -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DUWP_LITE_PACKAGE_VERSION=1.0.0.${{ github.run_number }}
      - name: Build
        env: { SCCACHE_GHA_ENABLED: "true" }
        run: cmake --build build-uwp-lite -- -k 0   # keep going so all compile errors surface in one run

      # makepri + makeappx + signtool (self-signed CN=Dev, like the probe).
      - name: Package (.msix)
        shell: cmd
        run: call host-uwp-lite\package.cmd build-uwp-lite

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $stage = 'build-uwp-lite/AppX'
          $builtins = @(Get-ChildItem "$stage/payload/builtin" -Filter *.dll -ErrorAction SilentlyContinue).Count
          $msix = Get-ChildItem build-uwp-lite/AppPackages -Filter *.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          $lines = @('### host-uwp-lite (build + package only; NOT run on hardware)')
          if ($msix) { $lines += ('- package: `{0}` ({1:N1} MB), version 1.0.0.${{ github.run_number }}' -f $msix.Name, ($msix.Length / 1MB)) } else { $lines += '- package: NOT produced' }
          $lines += "- Wine PE builtin DLLs bundled: $builtins" + $(if ($builtins -eq 0) { ' (wine-pe-builtin artifact unavailable; add them on the console)' } else { '' })
          $lines += '- winmd bundled: ' + (Test-Path "$stage/Win10XboxLite.winmd")
          $lines += '- AUMID: `win10xbox.uwp.lite_eqad6j9zhtw80!App`'
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v4
        with:
          name: host-uwp-lite-msix
          path: |
            build-uwp-lite/AppPackages/*.msix
            build-uwp-lite/AppPackages/*.cer
          if-no-files-found: error
          retention-days: 14
