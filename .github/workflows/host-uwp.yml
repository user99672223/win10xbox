name: host-uwp

# host-uwp: the REAL win10xbox UWP host (milestone M5): a C++/WinRT CoreApplication shell around
# the Host of host.h (launch.json -> machine folder staging -> Initialize -> process::Launch ->
# verdict in status.txt). This job BUILDS and PACKAGES it into a signed .msix (artifact
# host-uwp-msix) and runs the portable launch.json selftest; running it on an Xbox Series S in
# Dev Mode is the owner's job, later. It replaces the throwaway host-uwp-lite (workflow
# uwp-lite.yml, artifact host-uwp-lite-msix): the two packages differ in identity, exe name and
# WinRT namespace, so both install side by side. It is a separate workflow on purpose: ci.yml
# and its green jobs stay untouched.
#
# Standalone CMake project (host-uwp/CMakeLists.txt) that add_subdirectory()s third_party/,
# core/ and winexbox/ itself; the top-level CMakeLists.txt is not involved (its
# WIN10XBOX_BUILD_UWP option stays OFF in every workflow, and host-uwp/CMakeLists.txt refuses to
# be added to that tree). Same toolchain recipe as uwp-lite.yml, which is the one proven on CI
# (run #4 produced a signed .msix), and as the `windows` job in ci.yml, because that is the
# configuration core/ is known to build in: Ninja + cl + sccache. RelWithDebInfo (O2 + NDEBUG)
# is one of the two configurations ci.yml gates on.

# Every push to every branch, no path filter: the whole project is tested
# continuously (docs/HANDOFF.md, standing testing rule).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: host-uwp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read   # the job downloads the wine-pe-builtin artifact

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Nested submodules we need (zycore only; speakeasy's test corpora are not needed)
        run: git submodule update --init --recursive third_party/zydis
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Wine PE builtins (ntdll/kernelbase/kernel32 and friends) from the latest
      # successful wine-pe run. They are bundled INSIDE the package and copied to
      # LocalState at first run (the default HOST_UWP_BUILTIN_DIR is where this step puts them).
      #
      # MANDATORY, and retried. This used to be `continue-on-error` with a "the owner can add
      # them on the console" note, and that cost a real on-hardware test run: in run
      # 39809498419 the lookup transiently found nothing, the step shrugged, the package shipped
      # at 1.4 MB without the builtins, the job went GREEN, and the console reported
      # "RESULT: FAIL (no Wine PE builtins in the machine folder)". Two and a half hours earlier
      # the identical code had fetched 23 DLLs, so the failure is transient, not deterministic.
      # A package without the builtins cannot run a guest, so shipping one is never useful:
      # retry the lookup, and if it still fails make the job RED instead of publishing a package
      # that is guaranteed to fail on hardware.
      - name: Fetch wine-pe builtin DLLs (required)
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $ErrorActionPreference = 'Continue'
          $id = $null
          foreach ($attempt in 1..3) {
            foreach ($scope in @("--branch ${{ github.ref_name }}", "")) {
              $args = @('run','list','--repo','${{ github.repository }}','--workflow','wine-pe.yml',
                        '--status','success','--limit','1','--json','databaseId','--jq','.[0].databaseId')
              if ($scope) { $args += $scope.Split(' ') }
              $id = (& gh @args 2>$null | Select-Object -First 1)
              if ($id) { break }
            }
            if ($id) { break }
            Write-Host "attempt ${attempt}: no wine-pe run found yet; retrying in $(5 * $attempt)s"
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $id) {
            Write-Host "::error::could not find a successful wine-pe run after 3 attempts. The package would ship without the Wine PE builtins and could not run a guest, so this job fails rather than publishing it. Re-run the job, or run the wine-pe workflow."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path wine-pe/out/builtin | Out-Null
          foreach ($attempt in 1..3) {
            gh run download $id --repo ${{ github.repository }} --name wine-pe-builtin --dir wine-pe/out/builtin
            if ((Get-ChildItem wine-pe/out/builtin -Filter *.dll -ErrorAction SilentlyContinue).Count -gt 0) { break }
            Write-Host "attempt ${attempt}: download produced no DLLs; retrying in $(5 * $attempt)s"
            Start-Sleep -Seconds (5 * $attempt)
          }
          $n = (Get-ChildItem wine-pe/out/builtin -Filter *.dll -ErrorAction SilentlyContinue).Count
          if ($n -eq 0 -or -not (Test-Path wine-pe/out/builtin/ntdll.dll)) {
            Write-Host "::error::wine-pe-builtin from run $id yielded $n DLLs and no ntdll.dll. Failing rather than publishing a package that cannot run."
            exit 1
          }
          Write-Host "downloaded wine-pe-builtin from run $id ($n DLLs, ntdll.dll present)"

      # Mirror ci.yml's proven windows Configure. No -DCMAKE_POLICY_VERSION_MINIMUM:
      # ci.yml builds the same third_party/zydis + core/ on this runner without it,
      # and the earlier malformed value ("3") poisoned the cache so every
      # cmake_minimum_required (here, zydis, zycore) errored. shell: cmd so the
      # package-version arg (1.0.0.N) is passed literally and not reparsed by
      # PowerShell as a version token.
      - name: Configure
        shell: cmd
        env: { SCCACHE_GHA_ENABLED: "true" }
        run: >
          cmake -S host-uwp -B build-uwp -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DHOST_UWP_PACKAGE_VERSION=1.0.0.${{ github.run_number }}
      - name: Build
        env: { SCCACHE_GHA_ENABLED: "true" }
        run: cmake --build build-uwp -- -k 0   # keep going so all compile errors surface in one run

      # makepri + makeappx + signtool (self-signed CN=Dev, like the probe and uwp-lite).
      - name: Package (.msix)
        shell: cmd
        run: call host-uwp\package.cmd build-uwp

      # The launch.json parser (host-uwp/launch_config.cpp, portable code) against
      # selftest/selftest.cpp: a console program with no layer, WinRT or package, so it runs
      # on the runner. After Package on purpose: a failure turns the job red, but the .msix is
      # still produced and uploaded (see the upload condition below).
      - name: Selftest (launch.json parser)
        id: selftest
        run: ctest --test-dir build-uwp --output-on-failure --no-tests=error -R host_uwp.selftest

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $stage = 'build-uwp/AppX'
          $builtins = @(Get-ChildItem "$stage/payload/builtin" -Filter *.dll -ErrorAction SilentlyContinue).Count
          $guests = @(Get-ChildItem "$stage/payload/guest" -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) -join ', '
          $msix = Get-ChildItem build-uwp/AppPackages -Filter *.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          $lines = @('### host-uwp (build + package; NOT run on hardware)')
          if ($msix) { $lines += ('- package: `{0}` ({1:N1} MB), version 1.0.0.${{ github.run_number }}' -f $msix.Name, ($msix.Length / 1MB)) } else { $lines += '- package: NOT produced' }
          $lines += "- Wine PE builtin DLLs bundled: $builtins"
          $lines += '- winmd bundled: ' + (Test-Path "$stage/Win10XboxUwp.winmd")
          $lines += '- bundled guests: ' + $(if ($guests) { $guests } else { 'none' })
          $lines += '- packaged default launch.json: ' + (Test-Path "$stage/payload/launch.json")
          $lines += '- launch.json selftest: ${{ steps.selftest.outcome }}'
          $lines += '- AUMID: `win10xbox.uwp_eqad6j9zhtw80!App`'
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $global:LASTEXITCODE = 0

      # Second guard on the same mistake, independent of the fetch step: assert that the package
      # we are about to publish actually CONTAINS the builtins. The fetch is only one way to end
      # up without them (a staging or stage.cmake change is another), and the cost of being wrong
      # is a wasted on-hardware run, which is the most expensive feedback loop we have. ntdll.dll
      # is the one the host checks for by name at startup.
      - name: Assert the package can actually run a guest
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $stage = 'build-uwp/AppX'
          $n = @(Get-ChildItem "$stage/payload/builtin" -Filter *.dll -ErrorAction SilentlyContinue).Count
          $ntdll = Test-Path "$stage/payload/builtin/ntdll.dll"
          $msix = Get-ChildItem build-uwp/AppPackages -Filter *.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          $mb = if ($msix) { [math]::Round($msix.Length / 1MB, 1) } else { 0 }
          Write-Host "packaged builtins: $n DLL(s); ntdll.dll present: $ntdll; package: $mb MB"
          if ($n -eq 0 -or -not $ntdll) {
            Write-Host "::error::the package bundles $n builtin DLL(s) and ntdll.dll present=$ntdll, so it CANNOT run a guest: the host fails at startup with 'no Wine PE builtins in the machine folder'. That is exactly what shipped in run 39809498419 and wasted an on-hardware test. Failing instead of publishing it."
            exit 1
          }
          if ($mb -lt 10) {
            Write-Host "::error::package is only $mb MB; a complete one is about 21 MB. The builtins are probably missing from the payload even though the staging directory has them."
            exit 1
          }

      # Upload whenever a package exists, even if the selftest step failed (the job is then
      # red, but the owner still gets the .msix to look at). No package (the build failed)
      # means nothing to upload and no second, misleading error.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('build-uwp/AppPackages/*.msix') != '' }}
        with:
          name: host-uwp-msix
          path: |
            build-uwp/AppPackages/*.msix
            build-uwp/AppPackages/*.cer
            build-uwp/bin/win10xbox-uwp.map
            build-uwp/bin/win10xbox-uwp.pdb
            build-uwp/bin/win10xbox-uwp.exe
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------------------------
  # `run`: can a windows-latest runner INSTALL the signed .msix above and LAUNCH it? (an experiment, NON-GATING)
  #
  # The `msix` job stops at "built and packaged". This job takes the very artifact it uploaded (host-uwp-msix), trusts the
  # self-signed certificate, installs the package, activates it by AUMID and reads the verdict files out of the package's
  # LocalState: status.txt is the oracle (first line "RESULT: PASS ..." when the guest exited with the expected 42),
  # entry-reached.txt says whether control reached the guest, crash.txt/trace.log say what happened if it did not.
  #
  # Nothing here is known to work. A runner is a Server SKU in a hosted session, and every step below can legitimately refuse:
  # sideloading policy (0x80073CFF), certificate trust (0x800B0109), the AppX deployment service, the UWP shell (activation
  # needs a desktop session), the package's own dependencies. The job is built so that WHICHEVER step refuses ends in the
  # concrete error in the log and in the job summary, and the later steps still collect whatever exists. It does not try
  # anything clever to get around a refusal beyond the one documented remedy (enabling trusted-app sideloading) tried once.
  #
  # continue-on-error at job level: the workflow's result stays the `msix` job's. It is a separate job so that no step here
  # can change what the `msix` job gates on.
  # ---------------------------------------------------------------------------------------------------------------------
  run:
    needs: msix
    if: ${{ !cancelled() && needs.msix.result != 'skipped' }}
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests/appcontainer   # only the activation helper is needed
      - uses: actions/download-artifact@v4
        with:
          name: host-uwp-msix
          path: msix
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      # Compiled directly (static CRT), like the other small tools: not part of the CMake tree.
      - name: Build the activation helper (tests/appcontainer/uwp_activate.cpp)
        shell: cmd
        run: |
          cl /nologo /O2 /MT /EHsc /std:c++17 /W3 /utf-8 /D_CRT_SECURE_NO_WARNINGS /Fouwp_activate.obj /Feuwp_activate.exe tests\appcontainer\uwp_activate.cpp /link ole32.lib
          if errorlevel 1 exit /b 1

      # What the platform offers, before anything is attempted: it turns "activation failed" into an explanation.
      - name: Survey the runner (can it host UWP apps at all?)
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("OS: {0} | version {1} | build {2} | SKU {3} | product type {4} (1 workstation, 2 DC, 3 server)" -f $os.Caption, $os.Version, $os.BuildNumber, $os.OperatingSystemSKU, $os.ProductType)
          Write-Host ("this step runs in session {0} as {1}" -f [System.Diagnostics.Process]::GetCurrentProcess().SessionId, [Environment]::UserName)
          foreach ($n in 'AppXSvc', 'ClipSVC', 'StateRepository', 'camsvc') {
            $s = Get-Service -Name $n -ErrorAction SilentlyContinue
            if ($s) { Write-Host ("service {0}: {1}, start type {2}" -f $n, $s.Status, $s.StartType) } else { Write-Host ("service {0}: not present" -f $n) }
          }
          foreach ($p in 'explorer', 'sihost', 'ApplicationFrameHost', 'ShellExperienceHost', 'RuntimeBroker') {
            Write-Host ("process {0}: {1} running" -f $p, @(Get-Process -Name $p -ErrorAction SilentlyContinue).Count)
          }
          $pol = Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx' -ErrorAction SilentlyContinue
          Write-Host ("policy Appx\AllowAllTrustedApps = {0}" -f $(if ($pol) { $pol.AllowAllTrustedApps } else { '(not set)' }))
          $unlock = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -ErrorAction SilentlyContinue
          Write-Host ("AppModelUnlock AllowAllTrustedApps = {0}, AllowDevelopmentWithoutDevLicense = {1}" -f $(if ($unlock) { $unlock.AllowAllTrustedApps } else { '(not set)' }), $(if ($unlock) { $unlock.AllowDevelopmentWithoutDevLicense } else { '(not set)' }))
          Write-Host "installed packages named win10xbox*: $(@(Get-AppxPackage -Name 'win10xbox*' -ErrorAction SilentlyContinue).Count)"
          exit 0

      - name: Trust the certificate and install the package
        id: install
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $msix = Get-ChildItem -Path msix -Recurse -Filter *.msix | Select-Object -First 1
          $cer = Get-ChildItem -Path msix -Recurse -Filter *.cer | Select-Object -First 1
          if (-not $msix) { Write-Host '::error::the host-uwp-msix artifact holds no .msix'; exit 1 }
          Write-Host ("package: {0} ({1:N1} MB)" -f $msix.FullName, ($msix.Length / 1MB))
          if ($cer) {
            # Self-signed code-signing certificate CN=Dev: it has to be trusted before the package signature validates.
            # TrustedPeople is the store sideloading looks at; Root is what host-uwp/package.cmd tells a laptop owner to use.
            foreach ($store in 'Cert:\LocalMachine\TrustedPeople', 'Cert:\LocalMachine\Root') {
              try { Import-Certificate -FilePath $cer.FullName -CertStoreLocation $store | Out-Null; Write-Host "certificate imported into $store" }
              catch { Write-Host "::warning::could not import the certificate into ${store}: $($_.Exception.Message)" }
            }
          } else {
            Write-Host '::warning::the artifact holds no .cer: the signature cannot be trusted'
          }
          $installed = $false
          for ($attempt = 1; $attempt -le 2 -and -not $installed; $attempt++) {
            try {
              Add-AppxPackage -Path $msix.FullName -ErrorAction Stop
              $installed = $true
              Write-Host "Add-AppxPackage: SUCCEEDED (attempt $attempt)"
            } catch {
              $msg = $_.Exception.Message
              Write-Host "::warning::Add-AppxPackage FAILED (attempt $attempt): $msg"
              Write-Host ("error id: {0}" -f $_.FullyQualifiedErrorId)
              if ($attempt -eq 1 -and $msg -match '0x80073CFF') {
                # "To install this app you need either a Windows developer license or a sideloading-enabled system."
                Write-Host 'sideloading is not enabled on this system: enabling trusted-app installation (policy Appx\AllowAllTrustedApps=1) and trying once more'
                New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx' -Force | Out-Null
                New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx' -Name AllowAllTrustedApps -Value 1 -PropertyType DWord -Force | Out-Null
              } else {
                break
              }
            }
          }
          if (-not $installed) {
            Write-Host '--- recent AppX deployment errors and warnings ---'
            try {
              Get-WinEvent -LogName 'Microsoft-Windows-AppXDeploymentServer/Operational' -MaxEvents 40 -ErrorAction Stop |
                Where-Object { $_.LevelDisplayName -eq 'Error' -or $_.LevelDisplayName -eq 'Warning' } |
                Select-Object -First 12 |
                ForEach-Object { Write-Host ("[{0}] id {1}: {2}" -f $_.TimeCreated.ToString('HH:mm:ss'), $_.Id, ($_.Message -split "`n")[0]) }
            } catch { Write-Host "(cannot read the AppX deployment log: $($_.Exception.Message))" }
            exit 1
          }
          Get-AppxPackage -Name win10xbox.uwp | Format-List Name, PackageFullName, PackageFamilyName, InstallLocation, Status | Out-String | Write-Host

      - name: Launch by AUMID and wait for the app to end
        id: launch
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $pkg = Get-AppxPackage -Name win10xbox.uwp
          $aumid = "$($pkg.PackageFamilyName)!App"
          Write-Host "AUMID: $aumid (expected win10xbox.uwp_eqad6j9zhtw80!App)"
          & .\uwp_activate.exe $aumid --package-full-name $pkg.PackageFullName --timeout 240
          $rc = $LASTEXITCODE
          Write-Host "uwp_activate exit status: $rc (0 ended, 10 activation refused, 11 still running at the timeout, 12 COM setup failed)"
          Set-Content -Path uwp-activate.rc -Value $rc
          exit 0

      # The files are the test oracle: status.txt first.
      - name: Read the verdict files out of LocalState
        id: verdict
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $pkg = Get-AppxPackage -Name win10xbox.uwp
          $ls = Join-Path $env:LOCALAPPDATA ("Packages\" + $pkg.PackageFamilyName + "\LocalState")
          Write-Host "LocalState: $ls (exists: $(Test-Path $ls))"
          New-Item -ItemType Directory -Force -Path uwp-evidence | Out-Null
          if (Test-Path $ls) {
            Get-ChildItem -Path $ls -File | ForEach-Object { Copy-Item -Path $_.FullName -Destination uwp-evidence -Force; Write-Host ("  {0,-24} {1,10:N0} bytes" -f $_.Name, $_.Length) }
          }
          $status = Join-Path $ls 'status.txt'
          $first = '(no status.txt)'
          if (Test-Path $status) {
            Write-Host '--- status.txt ---'
            Get-Content -Path $status | ForEach-Object { Write-Host $_ }
            $first = (Get-Content -Path $status -TotalCount 1)
          }
          foreach ($f in 'crash.txt') {
            $p = Join-Path $ls $f
            if (Test-Path $p) { Write-Host "--- $f (first 60 lines) ---"; Get-Content -Path $p -TotalCount 60 | ForEach-Object { Write-Host $_ } }
          }
          foreach ($f in 'stdout.txt', 'trace.log') {
            $p = Join-Path $ls $f
            if (Test-Path $p) { Write-Host "--- $f (last 40 lines) ---"; Get-Content -Path $p -Tail 40 | ForEach-Object { Write-Host $_ } }
          }
          $entry = Test-Path (Join-Path $ls 'entry-reached.txt')
          $act = '(not run)'
          if (Test-Path uwp-activate.rc) { $act = (Get-Content uwp-activate.rc -TotalCount 1) }
          $lines = @('### host-uwp: install and run on a windows-latest runner (experiment, non-gating)')
          $lines += ('- OS: ' + (Get-CimInstance Win32_OperatingSystem).Caption + ' build ' + (Get-CimInstance Win32_OperatingSystem).BuildNumber)
          $lines += '- Add-AppxPackage: SUCCEEDED'
          $lines += ('- uwp_activate exit status: ' + $act + ' (0 ended, 10 activation refused, 11 still running at the timeout)')
          $lines += ('- guest entry reached (entry-reached.txt): ' + $entry)
          $lines += ('- verdict, first line of status.txt: `' + $first + '`')
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($first -like 'RESULT: PASS*') { Write-Host 'host-uwp run: PASS'; exit 0 }
          Write-Host "::warning::host-uwp run (non-gating): no PASS verdict: $first"
          exit 1

      - name: Summary of what stopped the run (when it did not get as far as a verdict)
        if: ${{ !cancelled() && (steps.install.outcome != 'success' || steps.launch.outcome != 'success') }}
        shell: powershell
        run: |
          $lines = @('### host-uwp: install and run on a windows-latest runner (experiment, non-gating)')
          $lines += ('- install step: ${{ steps.install.outcome }}')
          $lines += ('- launch step: ${{ steps.launch.outcome }}')
          $lines += '- the concrete error is in the log of that step (Add-AppxPackage HRESULT, or the ActivateApplication HRESULT printed by uwp_activate)'
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit 0

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: host-uwp-run-evidence
          path: |
            uwp-evidence
            uwp-activate.rc
          if-no-files-found: ignore
          retention-days: 7
