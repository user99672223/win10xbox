name: host-uwp

# host-uwp: the REAL win10xbox UWP host (milestone M5): a C++/WinRT CoreApplication shell around
# the Host of host.h (launch.json -> machine folder staging -> Initialize -> process::Launch ->
# verdict in status.txt). This job BUILDS and PACKAGES it into a signed .msix (artifact
# host-uwp-msix) and runs the portable launch.json selftest; running it on an Xbox Series S in
# Dev Mode is the owner's job, later. It replaces the throwaway host-uwp-lite (workflow
# uwp-lite.yml, artifact host-uwp-lite-msix): the two packages differ in identity, exe name and
# WinRT namespace, so both install side by side. It is a separate workflow on purpose: ci.yml
# and its green jobs stay untouched.
#
# Standalone CMake project (host-uwp/CMakeLists.txt) that add_subdirectory()s third_party/,
# core/ and winexbox/ itself; the top-level CMakeLists.txt is not involved (its
# WIN10XBOX_BUILD_UWP option stays OFF in every workflow, and host-uwp/CMakeLists.txt refuses to
# be added to that tree). Same toolchain recipe as uwp-lite.yml, which is the one proven on CI
# (run #4 produced a signed .msix), and as the `windows` job in ci.yml, because that is the
# configuration core/ is known to build in: Ninja + cl + sccache. RelWithDebInfo (O2 + NDEBUG)
# is one of the two configurations ci.yml gates on.

# Every push to every branch, no path filter: the whole project is tested
# continuously (docs/HANDOFF.md, standing testing rule).
# Main only (see uwp-lite.yml): slice branches run ci.yml and wine-pe.yml, the rest runs on the merge.
on:
  push:
    branches: ["claude/youthful-cerf-l7xxsb"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: host-uwp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read   # the job downloads the wine-pe-builtin artifact

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Nested submodules we need (zycore only; speakeasy's test corpora are not needed)
        run: git submodule update --init --recursive third_party/zydis
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Wine PE builtins (ntdll/kernelbase/kernel32 and friends) from the latest
      # successful wine-pe run. They are bundled INSIDE the package and copied to
      # LocalState at first run (the default HOST_UWP_BUILTIN_DIR is where this step puts them).
      #
      # MANDATORY, and retried. This used to be `continue-on-error` with a "the owner can add
      # them on the console" note, and that cost a real on-hardware test run: in run
      # 39809498419 the lookup transiently found nothing, the step shrugged, the package shipped
      # at 1.4 MB without the builtins, the job went GREEN, and the console reported
      # "RESULT: FAIL (no Wine PE builtins in the machine folder)". Two and a half hours earlier
      # the identical code had fetched 23 DLLs, so the failure is transient, not deterministic.
      # A package without the builtins cannot run a guest, so shipping one is never useful:
      # retry the lookup, and if it still fails make the job RED instead of publishing a package
      # that is guaranteed to fail on hardware.
      - name: Fetch wine-pe builtin DLLs (required)
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $ErrorActionPreference = 'Continue'
          $id = $null
          # Prefer the wine-pe run of THIS commit (wine-pe/ or wine-pe.yml changed in the push) and wait while it
          # runs, so a new wine-pe.yml (a new artifact, a new DLL) is never paired with an older run's artifacts;
          # that pairing is what failed run 40003374002 (no wine-pe-nls on the previous run). No run for this
          # commit = wine-pe did not change: the newest successful run on the branch is the right one.
          foreach ($attempt in 1..40) {
            $own = @(gh run list --repo ${{ github.repository }} --workflow wine-pe.yml --commit ${{ github.sha }} --limit 1 --json databaseId,status,conclusion 2>$null | ConvertFrom-Json)
            if ($own.Count -eq 0) { break }
            if ($own[0].status -eq 'completed') {
              if ($own[0].conclusion -eq 'success') { $id = $own[0].databaseId }
              else { Write-Host "wine-pe run $($own[0].databaseId) for this commit ended $($own[0].conclusion); falling back to the newest successful run" }
              break
            }
            Write-Host "attempt ${attempt}: wine-pe run $($own[0].databaseId) for this commit is $($own[0].status); waiting 60s"
            Start-Sleep -Seconds 60
          }
          foreach ($attempt in 1..3) {
            if ($id) { break }
            foreach ($scope in @("--branch ${{ github.ref_name }}", "")) {
              $args = @('run','list','--repo','${{ github.repository }}','--workflow','wine-pe.yml',
                        '--status','success','--limit','1','--json','databaseId','--jq','.[0].databaseId')
              if ($scope) { $args += $scope.Split(' ') }
              $id = (& gh @args 2>$null | Select-Object -First 1)
              if ($id) { break }
            }
            if ($id) { break }
            Write-Host "attempt ${attempt}: no wine-pe run found yet; retrying in $(5 * $attempt)s"
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $id) {
            Write-Host "::error::could not find a successful wine-pe run after 3 attempts. The package would ship without the Wine PE builtins and could not run a guest, so this job fails rather than publishing it. Re-run the job, or run the wine-pe workflow."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path wine-pe/out/builtin | Out-Null
          foreach ($attempt in 1..3) {
            gh run download $id --repo ${{ github.repository }} --name wine-pe-builtin --dir wine-pe/out/builtin
            if ((Get-ChildItem wine-pe/out/builtin -Filter *.dll -ErrorAction SilentlyContinue).Count -gt 0) { break }
            Write-Host "attempt ${attempt}: download produced no DLLs; retrying in $(5 * $attempt)s"
            Start-Sleep -Seconds (5 * $attempt)
          }
          $n = (Get-ChildItem wine-pe/out/builtin -Filter *.dll -ErrorAction SilentlyContinue).Count
          if ($n -eq 0 -or -not (Test-Path wine-pe/out/builtin/ntdll.dll)) {
            Write-Host "::error::wine-pe-builtin from run $id yielded $n DLLs and no ntdll.dll. Failing rather than publishing a package that cannot run."
            exit 1
          }
          Write-Host "downloaded wine-pe-builtin from run $id ($n DLLs, ntdll.dll present)"
          # The NLS data (same run): bundled as payload/nls so the package does not need the target's System32.
          New-Item -ItemType Directory -Force -Path wine-pe/out/nls | Out-Null
          foreach ($attempt in 1..3) {
            gh run download $id --repo ${{ github.repository }} --name wine-pe-nls --dir wine-pe/out/nls
            if ((Get-ChildItem wine-pe/out/nls -Filter *.nls -ErrorAction SilentlyContinue).Count -gt 0) { break }
            Write-Host "attempt ${attempt}: NLS download produced no files; retrying in $(5 * $attempt)s"
            Start-Sleep -Seconds (5 * $attempt)
          }
          $nn = (Get-ChildItem wine-pe/out/nls -Filter *.nls -ErrorAction SilentlyContinue).Count
          if ($nn -eq 0) {
            Write-Host "::error::wine-pe run $id has no wine-pe-nls artifact (or it is empty). Dispatch wine-pe.yml on this branch first. Failing rather than publishing a package whose guests crash in RtlInitNlsTables."
            exit 1
          }
          Write-Host "downloaded wine-pe-nls from run $id ($nn files)"

      # Chocolate Doom 3.1.1 + SDL2 DLLs + the shareware doom1.wad (about 10 MB), pinned by SHA-256 and verified on every
      # run (tools/ci/fetch_doom.ps1, same pins and cache key as ci.yml). Staged flat into payload\guest by stage.cmake
      # (-DHOST_UWP_EXTRA_GUEST_DIR); the sidecars (chocolate-doom.args/.env/.title, doom-timedemo.launch) are in
      # host-uwp/payload/guest. docs/slices/doompkg.md.
      - name: Cache Chocolate Doom and doom1.wad
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/doom-src
          key: doom-3.1.1-58c34c61ae954493fce5ff01fd553898240a0de25658aa97b43ac9510c49581f-wad-1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771
      - name: Fetch Chocolate Doom 3.1.1 and doom1.wad (packaged guest)
        shell: pwsh
        run: ./tools/ci/fetch_doom.ps1 -Out "${{ runner.temp }}/doom-guest"

      # Dear ImGui's release source for guest_imgui_d3d11 (host-uwp/CMakeLists.txt reads WIN10XBOX_IMGUI_DIR; same pin as ci.yml).
      # Both D3D11 guests run on the packaged machine-native-d3d folder (their .machine sidecars). docs/slices/uwpd3d.md.
      - name: Fetch Dear ImGui (guest_imgui_d3d11)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'imgui'
          for ($i = 1; $i -le 4; $i++) {
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
            git clone -q --depth 1 --branch v1.93.0 https://github.com/ocornut/imgui $dir
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not (Test-Path "$dir/examples/example_win32_directx11/main.cpp")) { throw "Dear ImGui v1.93.0 not fetched" }
          "WIN10XBOX_IMGUI_DIR=$dir" >> $env:GITHUB_ENV

      # The unmodified Direct3D 11 sample guest_d3dsample (host-uwp/CMakeLists.txt reads WIN10XBOX_D3DSAMPLE_DIR; same pin as ci.yml).
      - name: Cache the Direct3D 11 sample source
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/d3dsample
          key: d3dsample-src-1ad8f0f6a3e4d9be7e54ca52640ac12b6565ab0c
      - name: Fetch the Direct3D 11 sample (guest_d3dsample)
        shell: pwsh
        run: ./tools/ci/fetch_d3dsample.ps1 -Out "${{ runner.temp }}/d3dsample"

      # Mirror ci.yml's proven windows Configure. No -DCMAKE_POLICY_VERSION_MINIMUM:
      # ci.yml builds the same third_party/zydis + core/ on this runner without it,
      # and the earlier malformed value ("3") poisoned the cache so every
      # cmake_minimum_required (here, zydis, zycore) errored. shell: cmd so the
      # package-version arg (1.0.0.N) is passed literally and not reparsed by
      # PowerShell as a version token.
      - name: Configure
        shell: cmd
        env: { SCCACHE_GHA_ENABLED: "true" }
        run: >
          cmake -S host-uwp -B build-uwp -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DHOST_UWP_PACKAGE_VERSION=1.0.0.${{ github.run_number }}
          -DHOST_UWP_EXTRA_GUEST_DIR=${{ runner.temp }}\doom-guest
      - name: Build
        env: { SCCACHE_GHA_ENABLED: "true" }
        run: cmake --build build-uwp -- -k 0   # keep going so all compile errors surface in one run

      # makepri + makeappx + signtool (self-signed CN=Dev, like the probe and uwp-lite).
      - name: Package (.msix)
        shell: cmd
        run: call host-uwp\package.cmd build-uwp

      # Two console programs with no layer, WinRT or package, so they run on the runner:
      #   host_uwp.selftest  the launch.json parser (host-uwp/launch_config.cpp) against
      #                      selftest/selftest.cpp, plus the packaged payload/*.json files;
      #   host_uwp.blit      the presenter's frame path (host-uwp/blit.cpp, the code the console
      #                      runs): a WARP device, a synthetic BGRA frame uploaded and copied into a
      #                      64x64 render target, read back through a staging texture and checked
      #                      pixel by pixel. Only CreateSwapChainForCoreWindow is left to the console.
      # After Package on purpose: a failure turns the job red, but the .msix is still produced
      # and uploaded (see the upload condition below).
      - name: Selftest (launch.json parser, D3D11 blit on WARP)
        id: selftest
        run: ctest --test-dir build-uwp --output-on-failure --no-tests=error -R "host_uwp\."

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $stage = 'build-uwp/AppX'
          $builtins = @(Get-ChildItem "$stage/payload/builtin" -Filter *.dll -ErrorAction SilentlyContinue).Count
          $guests = @(Get-ChildItem "$stage/payload/guest" -File -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) -join ', '
          $msix = Get-ChildItem build-uwp/AppPackages -Filter *.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          $lines = @('### host-uwp (build + package; NOT run on hardware)')
          if ($msix) { $lines += ('- package: `{0}` ({1:N1} MB), version 1.0.0.${{ github.run_number }}' -f $msix.Name, ($msix.Length / 1MB)) } else { $lines += '- package: NOT produced' }
          $lines += "- Wine PE builtin DLLs bundled: $builtins"
          $lines += '- winmd bundled: ' + (Test-Path "$stage/Win10XboxUwp.winmd")
          $lines += '- bundled guests: ' + $(if ($guests) { $guests } else { 'none' })
          $lines += '- packaged default launch.json: ' + (Test-Path "$stage/payload/launch.json")
          $lines += '- selftests (launch.json parser, D3D11 blit on WARP): ${{ steps.selftest.outcome }}'
          $lines += '- AUMID: `win10xbox.uwp_eqad6j9zhtw80!App`'
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $global:LASTEXITCODE = 0

      # Second guard on the same mistake, independent of the fetch step: assert that the package
      # we are about to publish actually CONTAINS the builtins. The fetch is only one way to end
      # up without them (a staging or stage.cmake change is another), and the cost of being wrong
      # is a wasted on-hardware run, which is the most expensive feedback loop we have. ntdll.dll
      # is the one the host checks for by name at startup.
      - name: Assert the package can actually run a guest
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $stage = 'build-uwp/AppX'
          $n = @(Get-ChildItem "$stage/payload/builtin" -Filter *.dll -ErrorAction SilentlyContinue).Count
          $ntdll = Test-Path "$stage/payload/builtin/ntdll.dll"
          $msix = Get-ChildItem build-uwp/AppPackages -Filter *.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          $mb = if ($msix) { [math]::Round($msix.Length / 1MB, 1) } else { 0 }
          Write-Host "packaged builtins: $n DLL(s); ntdll.dll present: $ntdll; package: $mb MB"
          if ($n -eq 0 -or -not $ntdll) {
            Write-Host "::error::the package bundles $n builtin DLL(s) and ntdll.dll present=$ntdll, so it CANNOT run a guest: the host fails at startup with 'no Wine PE builtins in the machine folder'. That is exactly what shipped in run 39809498419 and wasted an on-hardware test. Failing instead of publishing it."
            exit 1
          }
          $nlsNeeded = @('l_intl.nls','c_10000.nls','c_1252.nls','locale.nls','sortdefault.nls')
          $nlsMissing = @($nlsNeeded | Where-Object { -not (Test-Path "$stage/payload/nls/$_") })
          Write-Host ("packaged NLS: " + @(Get-ChildItem "$stage/payload/nls" -Filter *.nls -ErrorAction SilentlyContinue).Count + " file(s); missing: " + ($nlsMissing -join ', '))
          if ($nlsMissing.Count -gt 0) {
            Write-Host "::error::the package lacks NLS file(s) $($nlsMissing -join ', ') (payload/nls): every guest crashes in Wine's RtlInitNlsTables on a console whose System32 does not have them. Failing instead of publishing it."
            exit 1
          }
          if ($mb -lt 10) {
            Write-Host "::error::package is only $mb MB; a complete one is about 21 MB. The builtins are probably missing from the payload even though the staging directory has them."
            exit 1
          }
          # Every guest the package is meant to carry to the console (host-uwp/CMakeLists.txt
          # HOST_UWP_GUESTS), and the packaged default launch.json naming the GUI guest.
          $expected = @('window.exe', 'hello.exe', 'hello_cui.exe', 'guest_hello.exe', 'guest_cpuid.exe',
                        'guest_sleep.exe', 'guest_dll.dll', 'smoke_cui.exe', 'drv_client.exe',
                        'guest_window2.exe', 'guest_window_input.exe', 'guest_window_input2.exe',
                        'guest_window_scroll.exe', 'guest_window_text.exe', 'guest_window_hooks.exe', 'guest_window_nc.exe', 'smoke.exe',
                        'guest_spawn.exe', 'guest_dialog.exe', 'guest_comctl.exe', 'guest_clipboard.exe',
                        'guest_seh.exe', 'guest_seh_dll.dll', 'guest_gdi_bitmap.exe', 'guest_window_menu.exe', 'guest_xinput.exe',
                        'guest_cursor.exe', 'guest_regpersist.exe', 'guest_identity.exe',
                        'guest_net.exe', 'guest_wasapi.exe', 'guest_xaudio2.exe', 'guest_xaudio2_play.exe', 'guest_nowine.exe', 'guest_named_objects.exe', 'guest_rdrand.exe',
                        'guest_d3d11_tri.exe', 'guest_imgui_d3d11.exe', 'guest_d3d11_tri.machine', 'guest_imgui_d3d11.machine',
                        'guest_d3d11_swap.exe', 'guest_d3d11_swap.machine',
                        'guest_d3dsample.exe', 'guest_d3dsample.machine', 'guest_d3dsample.env', 'guest_d3dsample.cwd', 'Tutorial07.fxh', 'seafloor.dds',
                        'guest_gamelike.exe', 'guest_gamelike.machine', 'guest_gamelike.env', 'guest_gamelike.title',
                        'guest_tebframe.exe', 'guest_net2.exe', 'guest_closure.exe', 'guest_display_mode.exe', 'guest_unload_cs.exe', 'guest_unload_cs_dll.dll')
          $missing = @($expected | Where-Object { -not (Test-Path "$stage/payload/guest/$_") })
          Write-Host ("bundled guests: " + (@(Get-ChildItem "$stage/payload/guest" -File | ForEach-Object { $_.Name }) -join ', '))
          if ($missing.Count -gt 0) {
            Write-Host "::error::the package is missing bundled guest(s): $($missing -join ', ')"
            exit 1
          }
          # Chocolate Doom is not a tests/guest program: it comes from fetch_doom.ps1 plus the sidecars, checked by name.
          $doom = @('chocolate-doom.exe', 'doom1.wad', 'SDL2.dll', 'chocolate-doom.args', 'chocolate-doom.env',
                    'chocolate-doom.title', 'doom-timedemo.launch')
          $missingDoom = @($doom | Where-Object { -not (Test-Path "$stage/payload/guest/$_") })
          if ($missingDoom.Count -gt 0) {
            Write-Host "::error::the package is missing Chocolate Doom file(s): $($missingDoom -join ', ')"
            exit 1
          }
          # The directory install (docs/slices/dirlaunch.md): payload/guest/dirtree/ is one picker entry (dirtree.launch), not a flat guest.
          $dirtree = @('dirtree.launch', 'bin/guest_dirtree.exe', 'data/file.pak') | Where-Object { -not (Test-Path "$stage/payload/guest/dirtree/$_") }
          if ($dirtree) {
            Write-Host "::error::the package is missing payload/guest/dirtree file(s): $($dirtree -join ', ')"
            exit 1
          }
          # The second machine folder (route B + Direct3D 11, LocalState\machine-native-d3d): its machine.json and msctf stand-in.
          $d3dMachine = @('machine.json', 'msctf.dll') | Where-Object { -not (Test-Path "$stage/payload/machine-native-d3d/$_") }
          if ($d3dMachine) {
            Write-Host "::error::the package is missing payload/machine-native-d3d file(s): $($d3dMachine -join ', ')"
            exit 1
          }
          # The third machine folder (emulated GUI + native Direct3D 11, LocalState\machine-emu-d3d, docs/slices/uwpswap.md).
          if (-not ((Test-Path "$stage/payload/machine-emu-d3d/machine.json") -and (Test-Path "$stage/payload/machine-emu-d3d/gdi32full.dll"))) {
            Write-Host '::error::the package is missing payload/machine-emu-d3d/machine.json or gdi32full.dll'
            exit 1
          }
          # Our own builtin DLLs (guest-dlls/): the XInput DLL under its three names.
          $ownDlls = @('xinput1_4.dll', 'xinput1_3.dll', 'xinput9_1_0.dll')
          $missingDlls = @($ownDlls | Where-Object { -not (Test-Path "$stage/payload/builtin/$_") })
          if ($missingDlls.Count -gt 0) {
            Write-Host "::error::the package is missing builtin DLL(s) of our own: $($missingDlls -join ', ')"
            exit 1
          }
          if (-not (Select-String -Path "$stage/payload/launch.json" -Pattern '"guest": "window.exe"' -Quiet)) {
            Write-Host "::error::payload/launch.json in the package does not run window.exe"
            exit 1
          }

      # Package contents: list what makeappx actually put in the .msix, check every guest of
      # payload/guests.txt (and every tests/guest/*.c) is in it, report sizes, and keep the package
      # under the console sideload budget (Dev Mode installs; 2 GB hard cap, we fail above 500 MB).
      - name: Verify package contents + size report
        if: ${{ !cancelled() && hashFiles('build-uwp/AppPackages/*.msix') != '' }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $msix = Get-ChildItem build-uwp/AppPackages -Filter *.msix | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          $entries = @($zip.Entries | ForEach-Object { [uri]::UnescapeDataString($_.FullName) })
          $groups = $zip.Entries | Group-Object { ([uri]::UnescapeDataString($_.FullName) -split '/')[0..1] -join '/' } |
            ForEach-Object { [pscustomobject]@{ Dir = $_.Name; Files = $_.Count; MB = [math]::Round(($_.Group | Measure-Object Length -Sum).Sum / 1MB, 2) } }
          $zip.Dispose()
          $groups | Sort-Object MB -Descending | Format-Table -AutoSize | Out-String | Write-Host
          $want = @(Get-Content build-uwp/AppX/payload/guests.txt | Where-Object { $_ })
          foreach ($c in Get-ChildItem tests/guest -Filter *.c) {
            if ($c.BaseName -eq 'msctf_stub' -or $c.BaseName -eq 'gdi32full_stub') { continue }   # a msctf.dll / gdi32full.dll stand-in for the native-GUI machine folders, not a guest
            if ($c.BaseName -eq 'dirtree') { continue }      # a directory install (payload/guest/dirtree/), checked below
            $n = if ($c.BaseName -eq 'dll') { 'guest_dll.dll' } elseif ($c.BaseName -eq 'unload_cs_dll') { 'guest_unload_cs_dll.dll' } elseif ($c.BaseName -eq 'window') { 'window.exe' } else { "guest_$($c.BaseName).exe" }
            if ($want -notcontains $n) { $want += $n }
          }
          $missing = @($want | Where-Object { $entries -notcontains "payload/guest/$_" })
          Write-Host "guests expected in package: $($want.Count); missing: $($missing.Count)"
          $mb = [math]::Round($msix.Length / 1MB, 1)
          $lines = @('### host-uwp package contents', "- package size: $mb MB (budget 500 MB)", "- guests: $($want -join ', ')", '', '| dir | files | MB |', '|---|---|---|')
          $lines += @($groups | ForEach-Object { "| $($_.Dir) | $($_.Files) | $($_.MB) |" })
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $doomMissing = @('chocolate-doom.exe', 'doom1.wad', 'SDL2.dll', 'chocolate-doom.args', 'chocolate-doom.env',
                           'chocolate-doom.title', 'doom-timedemo.launch') | Where-Object { $entries -notcontains "payload/guest/$_" }
          $dirMissing = @('payload/guest/dirtree/dirtree.launch', 'payload/guest/dirtree/bin/guest_dirtree.exe', 'payload/guest/dirtree/data/file.pak') | Where-Object { $entries -notcontains $_ }
          if ($dirMissing) { Write-Host "::error::directory install file(s) missing from the .msix: $($dirMissing -join ', ')"; exit 1 }
          if ($entries -notcontains 'payload/guests.txt') { Write-Host '::error::payload/guests.txt manifest missing from package'; exit 1 }
          if ($entries -notcontains 'payload/expected_exit.txt') { Write-Host '::error::payload/expected_exit.txt missing from package'; exit 1 }
          foreach ($f in 'l_intl.nls','c_10000.nls','c_1252.nls','locale.nls','sortdefault.nls') {
            if ($entries -notcontains "payload/nls/$f") { Write-Host "::error::payload/nls/$f missing from the .msix"; exit 1 }
          }
          if (-not ($entries | Where-Object { $_ -like 'payload/builtin/*.dll' })) { Write-Host '::error::no Wine builtins in package'; exit 1 }
          if ($missing.Count -gt 0) { Write-Host "::error::guest(s) missing from the .msix: $($missing -join ', ')"; exit 1 }
          $d3dMissing = @('payload/machine-native-d3d/machine.json', 'payload/machine-native-d3d/msctf.dll',
                          'payload/guest/guest_d3d11_tri.machine', 'payload/guest/guest_imgui_d3d11.machine',
                          'payload/guest/guest_d3d11_swap.machine', 'payload/machine-emu-d3d/machine.json', 'payload/machine-emu-d3d/gdi32full.dll',
                          'payload/guest/guest_d3dsample.machine', 'payload/guest/guest_d3dsample.env', 'payload/guest/guest_d3dsample.cwd',
                          'payload/guest/Tutorial07.fxh', 'payload/guest/seafloor.dds') | Where-Object { $entries -notcontains $_ }
          if ($d3dMissing) { Write-Host "::error::machine-native-d3d file(s) missing from the .msix: $($d3dMissing -join ', ')"; exit 1 }
          if ($doomMissing) { Write-Host "::error::Chocolate Doom file(s) missing from the .msix: $($doomMissing -join ', ')"; exit 1 }
          if ($mb -gt 500) { Write-Host "::error::package is $mb MB, over the 500 MB sideload budget"; exit 1 }

      # Upload whenever a package exists, even if the selftest step failed (the job is then
      # red, but the owner still gets the .msix to look at). No package (the build failed)
      # means nothing to upload and no second, misleading error.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('build-uwp/AppPackages/*.msix') != '' }}
        with:
          name: host-uwp-msix
          path: |
            build-uwp/AppPackages/*.msix
            build-uwp/AppPackages/*.cer
            build-uwp/bin/win10xbox-uwp.map
            build-uwp/bin/win10xbox-uwp.pdb
            build-uwp/bin/win10xbox-uwp.exe
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------------------------
  # `run`: can a windows-latest runner INSTALL the signed .msix above and LAUNCH it? (an experiment, NON-GATING)
  #
  # The `msix` job stops at "built and packaged". This job takes the very artifact it uploaded (host-uwp-msix), trusts the
  # self-signed certificate, installs the package, activates it by AUMID and reads the verdict files out of the package's
  # LocalState: status.txt is the oracle (first line "RESULT: PASS ..." when the guest exited with the expected 42),
  # entry-reached.txt says whether control reached the guest, crash.txt/trace.log say what happened if it did not.
  #
  # Nothing here is known to work. A runner is a Server SKU in a hosted session, and every step below can legitimately refuse:
  # sideloading policy (0x80073CFF), certificate trust (0x800B0109), the AppX deployment service, the UWP shell (activation
  # needs a desktop session), the package's own dependencies. The job is built so that WHICHEVER step refuses ends in the
  # concrete error in the log and in the job summary, and the later steps still collect whatever exists. It does not try
  # anything clever to get around a refusal beyond the one documented remedy (enabling trusted-app sideloading) tried once.
  #
  # continue-on-error at job level: the workflow's result stays the `msix` job's. It is a separate job so that no step here
  # can change what the `msix` job gates on.
  # ---------------------------------------------------------------------------------------------------------------------
  run:
    needs: msix
    if: ${{ !cancelled() && needs.msix.result != 'skipped' }}
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests/appcontainer   # only the activation helper is needed
      - uses: actions/download-artifact@v4
        with:
          name: host-uwp-msix
          path: msix
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      # Compiled directly (static CRT), like the other small tools: not part of the CMake tree.
      - name: Build the activation helper (tests/appcontainer/uwp_activate.cpp)
        shell: cmd
        run: |
          cl /nologo /O2 /MT /EHsc /std:c++17 /W3 /utf-8 /D_CRT_SECURE_NO_WARNINGS /Fouwp_activate.obj /Feuwp_activate.exe tests\appcontainer\uwp_activate.cpp /link ole32.lib
          if errorlevel 1 exit /b 1

      # What the platform offers, before anything is attempted: it turns "activation failed" into an explanation.
      - name: Survey the runner (can it host UWP apps at all?)
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("OS: {0} | version {1} | build {2} | SKU {3} | product type {4} (1 workstation, 2 DC, 3 server)" -f $os.Caption, $os.Version, $os.BuildNumber, $os.OperatingSystemSKU, $os.ProductType)
          Write-Host ("this step runs in session {0} as {1}" -f [System.Diagnostics.Process]::GetCurrentProcess().SessionId, [Environment]::UserName)
          foreach ($n in 'AppXSvc', 'ClipSVC', 'StateRepository', 'camsvc') {
            $s = Get-Service -Name $n -ErrorAction SilentlyContinue
            if ($s) { Write-Host ("service {0}: {1}, start type {2}" -f $n, $s.Status, $s.StartType) } else { Write-Host ("service {0}: not present" -f $n) }
          }
          foreach ($p in 'explorer', 'sihost', 'ApplicationFrameHost', 'ShellExperienceHost', 'RuntimeBroker') {
            Write-Host ("process {0}: {1} running" -f $p, @(Get-Process -Name $p -ErrorAction SilentlyContinue).Count)
          }
          $pol = Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx' -ErrorAction SilentlyContinue
          Write-Host ("policy Appx\AllowAllTrustedApps = {0}" -f $(if ($pol) { $pol.AllowAllTrustedApps } else { '(not set)' }))
          $unlock = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -ErrorAction SilentlyContinue
          Write-Host ("AppModelUnlock AllowAllTrustedApps = {0}, AllowDevelopmentWithoutDevLicense = {1}" -f $(if ($unlock) { $unlock.AllowAllTrustedApps } else { '(not set)' }), $(if ($unlock) { $unlock.AllowDevelopmentWithoutDevLicense } else { '(not set)' }))
          Write-Host "installed packages named win10xbox*: $(@(Get-AppxPackage -Name 'win10xbox*' -ErrorAction SilentlyContinue).Count)"
          exit 0

      - name: Trust the certificate and install the package
        id: install
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $msix = Get-ChildItem -Path msix -Recurse -Filter *.msix | Select-Object -First 1
          $cer = Get-ChildItem -Path msix -Recurse -Filter *.cer | Select-Object -First 1
          if (-not $msix) { Write-Host '::error::the host-uwp-msix artifact holds no .msix'; exit 1 }
          Write-Host ("package: {0} ({1:N1} MB)" -f $msix.FullName, ($msix.Length / 1MB))
          if ($cer) {
            # Self-signed code-signing certificate CN=Dev: it has to be trusted before the package signature validates.
            # TrustedPeople is the store sideloading looks at; Root is what host-uwp/package.cmd tells a laptop owner to use.
            foreach ($store in 'Cert:\LocalMachine\TrustedPeople', 'Cert:\LocalMachine\Root') {
              try { Import-Certificate -FilePath $cer.FullName -CertStoreLocation $store | Out-Null; Write-Host "certificate imported into $store" }
              catch { Write-Host "::warning::could not import the certificate into ${store}: $($_.Exception.Message)" }
            }
          } else {
            Write-Host '::warning::the artifact holds no .cer: the signature cannot be trusted'
          }
          $installed = $false
          for ($attempt = 1; $attempt -le 2 -and -not $installed; $attempt++) {
            try {
              Add-AppxPackage -Path $msix.FullName -ErrorAction Stop
              $installed = $true
              Write-Host "Add-AppxPackage: SUCCEEDED (attempt $attempt)"
            } catch {
              $msg = $_.Exception.Message
              Write-Host "::warning::Add-AppxPackage FAILED (attempt $attempt): $msg"
              Write-Host ("error id: {0}" -f $_.FullyQualifiedErrorId)
              if ($attempt -eq 1 -and $msg -match '0x80073CFF') {
                # "To install this app you need either a Windows developer license or a sideloading-enabled system."
                Write-Host 'sideloading is not enabled on this system: enabling trusted-app installation (policy Appx\AllowAllTrustedApps=1) and trying once more'
                New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx' -Force | Out-Null
                New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx' -Name AllowAllTrustedApps -Value 1 -PropertyType DWord -Force | Out-Null
              } else {
                break
              }
            }
          }
          if (-not $installed) {
            Write-Host '--- recent AppX deployment errors and warnings ---'
            try {
              Get-WinEvent -LogName 'Microsoft-Windows-AppXDeploymentServer/Operational' -MaxEvents 40 -ErrorAction Stop |
                Where-Object { $_.LevelDisplayName -eq 'Error' -or $_.LevelDisplayName -eq 'Warning' } |
                Select-Object -First 12 |
                ForEach-Object { Write-Host ("[{0}] id {1}: {2}" -f $_.TimeCreated.ToString('HH:mm:ss'), $_.Id, ($_.Message -split "`n")[0]) }
            } catch { Write-Host "(cannot read the AppX deployment log: $($_.Exception.Message))" }
            exit 1
          }
          Get-AppxPackage -Name win10xbox.uwp | Format-List Name, PackageFullName, PackageFamilyName, InstallLocation, Status | Out-String | Write-Host

      # The packaged launch.json shows the picker (for the console); this job pins window.exe through the
      # owner's LocalState\launch.json so the verdict (RESULT: PASS, exit 42) stays automatic and unchanged.
      - name: Write LocalState launch.json (window.exe, as the packaged default did before the picker)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: powershell
        run: |
          $pkg = Get-AppxPackage -Name win10xbox.uwp
          $ls = Join-Path $env:LOCALAPPDATA ("Packages\" + $pkg.PackageFamilyName + "\LocalState")
          New-Item -ItemType Directory -Force -Path $ls | Out-Null
          $json = '{ "guest": "window.exe", "args": ["30"], "expect_exit_code": 42, "trace": "+user,+gdi", "exit_when_done": false, "timeout_sec": 600 }'
          Set-Content -Path (Join-Path $ls 'launch.json') -Value $json -Encoding ascii
          & icacls $ls /grant '*S-1-15-2-1:(OI)(CI)F' /T | Out-Host
          Get-Content (Join-Path $ls 'launch.json') | Out-Host

      - name: Launch by AUMID and wait for the app to end
        id: launch
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $pkg = Get-AppxPackage -Name win10xbox.uwp
          $aumid = "$($pkg.PackageFamilyName)!App"
          Write-Host "AUMID: $aumid (expected win10xbox.uwp_eqad6j9zhtw80!App)"
          & .\uwp_activate.exe $aumid --package-full-name $pkg.PackageFullName --timeout 240
          $rc = $LASTEXITCODE
          Write-Host "uwp_activate exit status: $rc (0 ended, 10 activation refused, 11 still running at the timeout, 12 COM setup failed)"
          Set-Content -Path uwp-activate.rc -Value $rc
          exit 0

      # The files are the test oracle: status.txt first.
      - name: Read the verdict files out of LocalState
        id: verdict
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $pkg = Get-AppxPackage -Name win10xbox.uwp
          $ls = Join-Path $env:LOCALAPPDATA ("Packages\" + $pkg.PackageFamilyName + "\LocalState")
          Write-Host "LocalState: $ls (exists: $(Test-Path $ls))"
          New-Item -ItemType Directory -Force -Path uwp-evidence | Out-Null
          if (Test-Path $ls) {
            Get-ChildItem -Path $ls -File | ForEach-Object { Copy-Item -Path $_.FullName -Destination uwp-evidence -Force; Write-Host ("  {0,-24} {1,10:N0} bytes" -f $_.Name, $_.Length) }
          }
          $status = Join-Path $ls 'status.txt'
          $first = '(no status.txt)'
          if (Test-Path $status) {
            Write-Host '--- status.txt ---'
            Get-Content -Path $status | ForEach-Object { Write-Host $_ }
            $first = (Get-Content -Path $status -TotalCount 1)
          }
          # Which source served each NLS file: nls-pkg = the package's payload/nls, nls = copied from the runner's own
          # System32 (a fallback that would mask a package without NLS; there must be none). The guest-side reads come
          # only from LocalState\machine (nt_nls.cpp has no host-System32 fallback).
          Write-Host '--- NLS staging lines (stage[nls-pkg] = package, stage[nls] = host System32 fallback) ---'
          $nlsLines = @(Get-ChildItem -Path $ls -File -ErrorAction SilentlyContinue | ForEach-Object { Select-String -Path $_.FullName -Pattern 'stage\[nls(-pkg)?\]' -ErrorAction SilentlyContinue } | ForEach-Object { $_.Line })
          $nlsLines | Select-Object -First 40 | ForEach-Object { Write-Host $_ }
          $fromHost = @($nlsLines | Where-Object { $_ -match 'stage\[nls\].*: copied' })
          if ($fromHost.Count -gt 0) { Write-Host "::warning::$($fromHost.Count) NLS file(s) came from the runner's System32, not the package" }
          foreach ($f in 'crash.txt') {
            $p = Join-Path $ls $f
            if (Test-Path $p) { Write-Host "--- $f (first 60 lines) ---"; Get-Content -Path $p -TotalCount 60 | ForEach-Object { Write-Host $_ } }
          }
          foreach ($f in 'stdout.txt', 'trace.log') {
            $p = Join-Path $ls $f
            if (Test-Path $p) { Write-Host "--- $f (last 40 lines) ---"; Get-Content -Path $p -Tail 40 | ForEach-Object { Write-Host $_ } }
          }
          $entry = Test-Path (Join-Path $ls 'entry-reached.txt')
          $act = '(not run)'
          if (Test-Path uwp-activate.rc) { $act = (Get-Content uwp-activate.rc -TotalCount 1) }
          $lines = @('### host-uwp: install and run on a windows-latest runner (experiment, non-gating)')
          $lines += ('- OS: ' + (Get-CimInstance Win32_OperatingSystem).Caption + ' build ' + (Get-CimInstance Win32_OperatingSystem).BuildNumber)
          $lines += '- Add-AppxPackage: SUCCEEDED'
          $lines += ('- uwp_activate exit status: ' + $act + ' (0 ended, 10 activation refused, 11 still running at the timeout)')
          $lines += ('- guest entry reached (entry-reached.txt): ' + $entry)
          $lines += ('- verdict, first line of status.txt: `' + $first + '`')
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($first -like 'RESULT: PASS*') { Write-Host 'host-uwp run: PASS'; exit 0 }
          Write-Host "::warning::host-uwp run (non-gating): no PASS verdict: $first"
          exit 1

      - name: Summary of what stopped the run (when it did not get as far as a verdict)
        if: ${{ !cancelled() && (steps.install.outcome != 'success' || steps.launch.outcome != 'success') }}
        shell: powershell
        run: |
          $lines = @('### host-uwp: install and run on a windows-latest runner (experiment, non-gating)')
          $lines += ('- install step: ${{ steps.install.outcome }}')
          $lines += ('- launch step: ${{ steps.launch.outcome }}')
          $lines += '- the concrete error is in the log of that step (Add-AppxPackage HRESULT, or the ActivateApplication HRESULT printed by uwp_activate)'
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit 0

      # Second pinned run on the same install: guest_d3d11_tri.exe on LocalState\machine-native-d3d (launch.json "machine"; the
      # picker would use the guest's .machine sidecar). Native d3d11/dxgi/user32/win32u come BY NAME from the runner's System32.
      # Expect exit 42 (centre pixel = triangle colour); the "d3d11: adapter=" line in stdout.txt names the adapter. The
      # all-programs assert (report.txt) is in the launcher job.
      - name: Run guest_d3d11_tri.exe on machine-native-d3d (pinned, same install)
        id: d3d
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $pkg = Get-AppxPackage -Name win10xbox.uwp
          $ls = Join-Path $env:LOCALAPPDATA ("Packages\" + $pkg.PackageFamilyName + "\LocalState")
          # The window.exe run keeps the app open (exit_when_done false): end it so the next activation starts a fresh process.
          Get-Process -Name 'win10xbox*' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          foreach ($f in 'status.txt', 'stdout.txt', 'crash.txt', 'entry-reached.txt') { Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $ls $f) }
          $json = '{ "guest": "guest_d3d11_tri.exe", "machine": "machine-native-d3d", "expect_exit_code": 42, "trace": "+user,+modules", "exit_when_done": true, "timeout_sec": 240 }'
          Set-Content -Path (Join-Path $ls 'launch.json') -Value $json -Encoding ascii
          & .\uwp_activate.exe "$($pkg.PackageFamilyName)!App" --package-full-name $pkg.PackageFullName --timeout 300
          Write-Host "uwp_activate exit status: $LASTEXITCODE"
          New-Item -ItemType Directory -Force -Path uwp-evidence-d3d | Out-Null
          foreach ($f in 'status.txt', 'stdout.txt', 'trace.log', 'crash.txt') { $p = Join-Path $ls $f; if (Test-Path $p) { Copy-Item $p uwp-evidence-d3d -Force } }
          $status = Join-Path $ls 'status.txt'
          $first = if (Test-Path $status) { Get-Content -Path $status -TotalCount 1 } else { '(no status.txt)' }
          $out = if (Test-Path (Join-Path $ls 'stdout.txt')) { Get-Content -Path (Join-Path $ls 'stdout.txt') -Raw } else { '' }
          Write-Host '--- status.txt ---'; if (Test-Path $status) { Get-Content $status | ForEach-Object { Write-Host $_ } }
          Write-Host '--- stdout.txt ---'; Write-Host $out
          $tl = Join-Path $ls 'trace.log'
          if (Test-Path $tl) { Write-Host '--- trace.log: machine / stage / d3d lines ---'; Select-String -Path $tl -Pattern 'machine folder|stage\[stub\]|stage\[native\].*(d3d11|dxgi|user32|win32u)|d3d11|dxgi|error' | Select-Object -First 60 | ForEach-Object { Write-Host $_.Line } }
          $fail = @()
          if ($first -notlike 'RESULT: PASS*') { $fail += "status.txt: $first" }
          if ($out -notmatch 'd3d11: adapter=') { $fail += 'no "d3d11: adapter=" line in stdout.txt' }
          if ($out -notmatch 'd3d11: centre=ff0000ff corner=0000ffff') { $fail += 'centre/corner pixels are not ff0000ff/0000ffff' }
          $lines = @('### host-uwp: guest_d3d11_tri.exe on machine-native-d3d (pinned run, same install)', "- verdict: ``$first``")
          $adapter = [regex]::Match($out, 'd3d11: adapter=[^\r\n]*').Value
          $lines += "- $adapter"
          if ($fail.Count -eq 0) { $lines += '- PASS' } else { $fail | ForEach-Object { $lines += "- FAIL: $_"; Write-Host "::error::$_" } }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($fail.Count -gt 0) { exit 1 }

      # Third pinned run on the same install: guest_d3d11_swap.exe on LocalState\machine-emu-d3d (docs/slices/uwpswap.md): the
      # emulated window manager (the window path that exists on the console), the native d3d11/dxgi, a virtual swap chain whose
      # frames core/user composes and the presenter shows. Expect exit 42 and the readback line; the screenshot is screen.bmp.
      - name: Run guest_d3d11_swap.exe on machine-emu-d3d (pinned, same install)
        id: swap
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $pkg = Get-AppxPackage -Name win10xbox.uwp
          $ls = Join-Path $env:LOCALAPPDATA ("Packages\" + $pkg.PackageFamilyName + "\LocalState")
          Get-Process -Name 'win10xbox*' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          foreach ($f in 'status.txt', 'stdout.txt', 'crash.txt', 'entry-reached.txt', 'trace.log') { Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $ls $f) }
          $json = '{ "guest": "guest_d3d11_swap.exe", "machine": "machine-emu-d3d", "expect_exit_code": 42, "trace": "+dispatch,+user,+modules", "exit_when_done": true, "timeout_sec": 240 }'
          Set-Content -Path (Join-Path $ls 'launch.json') -Value $json -Encoding ascii
          & .\uwp_activate.exe "$($pkg.PackageFamilyName)!App" --package-full-name $pkg.PackageFullName --timeout 300
          Write-Host "uwp_activate exit status: $LASTEXITCODE"
          New-Item -ItemType Directory -Force -Path uwp-evidence-swap | Out-Null
          foreach ($f in 'status.txt', 'stdout.txt', 'trace.log', 'crash.txt', 'screen.bmp') { $p = Join-Path $ls $f; if (Test-Path $p) { Copy-Item $p uwp-evidence-swap -Force } }
          $status = Join-Path $ls 'status.txt'
          $first = if (Test-Path $status) { Get-Content -Path $status -TotalCount 1 } else { '(no status.txt)' }
          $out = if (Test-Path (Join-Path $ls 'stdout.txt')) { Get-Content -Path (Join-Path $ls 'stdout.txt') -Raw } else { '' }
          Write-Host '--- status.txt ---'; if (Test-Path $status) { Get-Content $status | ForEach-Object { Write-Host $_ } }
          Write-Host '--- stdout.txt ---'; Write-Host $out
          $tl = Join-Path $ls 'trace.log'
          if (Test-Path $tl) { Write-Host '--- trace.log: machine / d3d native / dxgi / error lines ---'; Select-String -Path $tl -Pattern 'machine folder|d3d native|dxgi:|error' | Select-Object -First 60 | ForEach-Object { Write-Host $_.Line } }
          $fail = @()
          if ($first -notlike 'RESULT: PASS*') { $fail += "status.txt: $first" }
          if ($out -notmatch 'swap: readback centre=ffff0000 corner=ff0000ff') { $fail += 'no "swap: readback centre=ffff0000 corner=ff0000ff" line in stdout.txt' }
          $lines = @('### host-uwp: guest_d3d11_swap.exe on machine-emu-d3d (pinned run, same install)', "- verdict: ``$first``")
          if ($fail.Count -eq 0) { $lines += '- PASS' } else { $fail | ForEach-Object { $lines += "- FAIL: $_"; Write-Host "::error::$_" } }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($fail.Count -gt 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: host-uwp-run-evidence
          path: |
            uwp-evidence
            uwp-evidence-d3d
            uwp-evidence-swap
            uwp-activate.rc
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------------------------------
  # `launcher`: GATING. The on-console launcher (host-uwp/launcher.cpp, docs/HANDOFF.md "Launcher") on the runner's CoreWindow.
  #
  # Installs the same signed .msix as `run`, writes LocalState\launch.json with "picker": true and the test hook
  # "autoselect": ["hello_cui.exe", "guest_hello.exe"] (the launcher chooses those entries itself, no gamepad needed; between the
  # two the app restarts itself with CoreApplication.RequestRestartAsync, one guest per process), activates the app and asserts
  # on LocalState\launcher_result.txt: TWO blocks (run=1 hello_cui.exe, run=2 guest_hello.exe), each ran=yes and exit_code=42, and
  # the first guest's stdout reached the result screen's tail (the launcher's "last 20 lines"). The list and result screens go through the real presenter on the runner's
  # CoreWindow; only the gamepad/keyboard navigation itself is not driven here.
  #
  # Unlike `run` (an experiment) this job is not continue-on-error: `run` has installed and activated the package on
  # windows-latest, which is what makes this a usable gate.
  # ---------------------------------------------------------------------------------------------------------------------
  launcher:
    needs: msix
    if: ${{ !cancelled() && needs.msix.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests/appcontainer
      - uses: actions/download-artifact@v4
        with:
          name: host-uwp-msix
          path: msix
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      - name: Build the activation helper (tests/appcontainer/uwp_activate.cpp)
        shell: cmd
        run: |
          cl /nologo /O2 /MT /EHsc /std:c++17 /W3 /utf-8 /D_CRT_SECURE_NO_WARNINGS /Fouwp_activate.obj /Feuwp_activate.exe tests\appcontainer\uwp_activate.cpp /link ole32.lib
          if errorlevel 1 exit /b 1

      - name: Trust the certificate and install the package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $msix = Get-ChildItem -Path msix -Recurse -Filter *.msix | Select-Object -First 1
          $cer = Get-ChildItem -Path msix -Recurse -Filter *.cer | Select-Object -First 1
          if (-not $msix -or -not $cer) { Write-Host '::error::the host-uwp-msix artifact holds no .msix/.cer'; exit 1 }
          foreach ($store in 'Cert:\LocalMachine\TrustedPeople', 'Cert:\LocalMachine\Root') {
            try { Import-Certificate -FilePath $cer.FullName -CertStoreLocation $store | Out-Null; Write-Host "certificate imported into $store" }
            catch { Write-Host "::warning::could not import the certificate into ${store}: $($_.Exception.Message)" }
          }
          $installed = $false
          for ($attempt = 1; $attempt -le 2 -and -not $installed; $attempt++) {
            try { Add-AppxPackage -Path $msix.FullName -ErrorAction Stop; $installed = $true; Write-Host "Add-AppxPackage: SUCCEEDED (attempt $attempt)" }
            catch {
              $msg = $_.Exception.Message
              Write-Host "::warning::Add-AppxPackage FAILED (attempt $attempt): $msg"
              if ($attempt -eq 1 -and $msg -match '0x80073CFF') {
                New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx' -Force | Out-Null
                New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx' -Name AllowAllTrustedApps -Value 1 -PropertyType DWord -Force | Out-Null
              } else { break }
            }
          }
          if (-not $installed) { Write-Host '::error::the package could not be installed'; exit 1 }

      # LocalState\launch.json: the picker with the test hook. The folder may not exist before the first run, and a folder
      # made by this user is not writable by the AppContainer unless it is granted (ALL APPLICATION PACKAGES, S-1-15-2-1).
      - name: Write LocalState launch.json (picker + autoselect hello_cui.exe, guest_hello.exe)
        shell: powershell
        run: |
          $pkg = Get-AppxPackage -Name win10xbox.uwp
          $ls = Join-Path $env:LOCALAPPDATA ("Packages\" + $pkg.PackageFamilyName + "\LocalState")
          New-Item -ItemType Directory -Force -Path $ls | Out-Null
          $json = '{ "picker": true, "autoselect": ["hello_cui.exe", "guest_hello.exe"], "expect_exit_code": 42, "exit_when_done": true, "timeout_sec": 180 }'
          Set-Content -Path (Join-Path $ls 'launch.json') -Value $json -Encoding ascii
          & icacls $ls /grant '*S-1-15-2-1:(OI)(CI)F' /T | Out-Host
          Write-Host "LocalState: $ls"
          Get-Content (Join-Path $ls 'launch.json') | Out-Host

      - name: Launch by AUMID and wait for the app to end
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $pkg = Get-AppxPackage -Name win10xbox.uwp
          $aumid = "$($pkg.PackageFamilyName)!App"
          & .\uwp_activate.exe $aumid --package-full-name $pkg.PackageFullName --timeout 240
          $rc = $LASTEXITCODE
          Write-Host "uwp_activate exit status: $rc (0 ended, 10 activation refused, 11 still running at the timeout, 12 COM setup failed)"
          Set-Content -Path uwp-activate.rc -Value $rc
          # The app restarts itself between the two runs: uwp_activate may see the FIRST process end. Wait for the second
          # run's block (run=2) in launcher_result.txt and for the restarted process to end.
          $ls = Join-Path $env:LOCALAPPDATA ("Packages\" + $pkg.PackageFamilyName + "\LocalState")
          $result = Join-Path $ls 'launcher_result.txt'
          for ($i = 0; $i -lt 90; $i++) {
            if ((Test-Path $result) -and (Select-String -Path $result -Pattern '^run=2' -Quiet)) { break }
            Start-Sleep -Seconds 2
          }
          for ($i = 0; $i -lt 30 -and (Get-Process -Name 'win10xbox*' -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 2 }
          Write-Host ("launcher_result.txt run=2 block present: " + ((Test-Path $result) -and (Select-String -Path $result -Pattern '^run=2' -Quiet)))
          exit 0

      - name: Collect the evidence and assert on launcher_result.txt
        id: assert
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $pkg = Get-AppxPackage -Name win10xbox.uwp
          $ls = Join-Path $env:LOCALAPPDATA ("Packages\" + $pkg.PackageFamilyName + "\LocalState")
          New-Item -ItemType Directory -Force -Path uwp-evidence | Out-Null
          if (Test-Path $ls) { Get-ChildItem -Path $ls -File | ForEach-Object { Copy-Item -Path $_.FullName -Destination uwp-evidence -Force; Write-Host ("  {0,-24} {1,10:N0} bytes" -f $_.Name, $_.Length) } }
          foreach ($f in 'status.txt', 'launcher_result.txt') {
            $p = Join-Path $ls $f
            if (Test-Path $p) { Write-Host "--- $f ---"; Get-Content -Path $p | ForEach-Object { Write-Host $_ } } else { Write-Host "--- ${f}: MISSING ---" }
          }
          foreach ($f in 'crash.txt') { $p = Join-Path $ls $f; if (Test-Path $p) { Write-Host "--- $f (first 60 lines) ---"; Get-Content -Path $p -TotalCount 60 | ForEach-Object { Write-Host $_ } } }
          $p = Join-Path $ls 'trace.log'
          if (Test-Path $p) { Write-Host '--- trace.log (lines mentioning the launcher or display, last 60) ---'; Select-String -Path $p -Pattern 'launcher|display:' | Select-Object -Last 60 | ForEach-Object { Write-Host $_.Line } }
          $result = Join-Path $ls 'launcher_result.txt'
          $text = if (Test-Path $result) { Get-Content -Path $result -Raw } else { '' }
          $fail = @()
          $countLine = ''
          if (-not $text) { $fail += 'LocalState\launcher_result.txt was not written (the launcher did not run the entry)' }
          else {
            $blocks = @($text -split '(?m)^(?=run=)' | Where-Object { $_ -match '(?m)^run=' })
            if ($blocks.Count -ne 2) { $fail += "expected 2 result blocks (one per run, the app restarts between them), found $($blocks.Count)" }
            $want = @('hello_cui.exe', 'guest_hello.exe')
            for ($i = 0; $i -lt [Math]::Min($blocks.Count, 2); $i++) {
              $b = $blocks[$i]; $n = $i + 1
              if ($b -notmatch "(?m)^run=$n\s*$") { $fail += "block $n is not run=$n" }
              if ($b -notmatch ('(?m)^guest=' + [regex]::Escape($want[$i]) + '\s*$')) { $fail += "block $n is not for $($want[$i])" }
              if ($b -notmatch '(?m)^ran=yes\s*$') { $fail += "block ${n}: the guest did not run (ran=yes missing)" }
              if ($b -notmatch '(?m)^exit_code=42\s*$') { $fail += "block ${n}: exit code 42 was not captured" }
            }
            if ($blocks.Count -ge 1 -and $blocks[0] -notmatch '(?m)^\s+\| hello from guest\s*$') { $fail += 'the first guest stdout (hello from guest) is not in the result tail' }
          }
          $lines = @('### host-uwp launcher (picker + autoselect list, two runs with a self-restart, on the runner CoreWindow)')
          if ($fail.Count -eq 0) { $lines += '- PASS: hello_cui.exe then guest_hello.exe launched from the picker across an app restart, exit code 42 each, two blocks in launcher_result.txt' }
          else { $fail | ForEach-Object { $lines += "- FAIL: $_"; Write-Host "::error::$_" } }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($fail.Count -gt 0) { exit 1 }

      # "Run every program (report)": launch.json "autoselect": "all" runs every bundled program in turn (the app restarts
      # between them), 60 s each (guest_cursor.exe waits for input up to its own 40 s watchdog), and writes LocalState\report.txt (header + one block per program) and <name>.bmp. The
      # runner has no gamepad, so guest_xinput.exe's expected result is its own "no pad" exit code (the verdict says PASS).
      - name: Write LocalState launch.json (autoselect all) and run every program
        id: all
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $pkg = Get-AppxPackage -Name win10xbox.uwp
          $ls = Join-Path $env:LOCALAPPDATA ("Packages\" + $pkg.PackageFamilyName + "\LocalState")
          foreach ($f in 'launcher_result.txt', 'report.txt') { Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $ls $f) }
          $json = '{ "picker": true, "autoselect": "all", "autoselect_timeout_sec": 60, "exit_when_done": true }'
          Set-Content -Path (Join-Path $ls 'launch.json') -Value $json -Encoding ascii
          & .\uwp_activate.exe "$($pkg.PackageFamilyName)!App" --package-full-name $pkg.PackageFullName --timeout 300
          $report = Join-Path $ls 'report.txt'
          # Up to 40 min: Chocolate Doom (interactive, bundled by -doompkg) and any guest that waits for input run
          # to the 60 s limit each, plus one restart per program.
          # Wait for the header whose programs= equals the number of chain entries (or chain=done / chain=aborted), not for any header.
          $dirw = Join-Path $pkg.InstallLocation 'payload\guest'
          $want = @(Get-ChildItem -Path $dirw -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '\.(exe|launch)$' }).Count + @(Get-ChildItem -Path $dirw -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName ($_.Name + '.launch')) }).Count
          Write-Host "chain entries expected: $want"
          $finished = $false
          for ($i = 0; $i -lt 1200; $i++) {
            if (Test-Path $report) {
              $rt = Get-Content -Path $report -Raw -ErrorAction SilentlyContinue
              if ($rt -match '(?m)^chain=(done|aborted)\s*$' -or ($rt -match '(?m)^programs=(\d+)\s*$' -and [int]$Matches[1] -eq $want)) { $finished = $true; break }
            }
            Start-Sleep -Seconds 2
          }
          Write-Host ("report.txt finished: " + $finished)
          exit 0

      - name: Assert on report.txt
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $pkg = Get-AppxPackage -Name win10xbox.uwp
          $ls = Join-Path $env:LOCALAPPDATA ("Packages\" + $pkg.PackageFamilyName + "\LocalState")
          New-Item -ItemType Directory -Force -Path uwp-evidence-all | Out-Null
          foreach ($f in 'report.txt', 'status.txt', 'crash.txt', 'stdout.txt', 'trace.log') { $p = Join-Path $ls $f; if (Test-Path $p) { Copy-Item $p uwp-evidence-all -Force } }
          Get-ChildItem -Path $ls -Filter *.bmp -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName uwp-evidence-all -Force }
          $p = Join-Path $ls 'report.txt'
          $text = if (Test-Path $p) { Get-Content -Path $p -Raw } else { '' }
          if ($text) { Write-Host '--- report.txt (header and verdict lines) ---'; $text -split "`n" | Where-Object { $_ -match '^(# |os_build|package|date_utc|programs|pass|fail|exited|timeout|knownfail|crash=|crash$|skipped|program=|verdict=)' } | ForEach-Object { Write-Host $_ } }
          $fail = @()
          $countLine = ''
          if (-not $text) { $fail += 'LocalState\report.txt was not written' }
          else {
            if ($text -notmatch '(?m)^os_build=\d+\.\d+\.\d+') { $fail += 'the report header has no os_build' }
            $dir = Join-Path $pkg.InstallLocation 'payload\guest'
            $bundled = @(Get-ChildItem -Path $dir -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '\.(exe|launch)$' } | ForEach-Object { $_.Name })
            # A subdirectory <dir>\<dir>.launch is one entry named <dir> (docs/slices/dirlaunch.md).
            $bundled += @(Get-ChildItem -Path $dir -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName ($_.Name + '.launch')) } | ForEach-Object { $_.Name })
            Write-Host "bundled programs: $($bundled.Count)"
            # The expected-exit table (tests/guest/expected_exit.txt, staged next to guests.txt): <program> <code>[=<label>] ...
            $tablePath = Join-Path $pkg.InstallLocation 'payload\expected_exit.txt'
            $table = @{}
            if (-not (Test-Path $tablePath)) { $fail += 'payload\expected_exit.txt is not in the package' }
            else {
              foreach ($tl in Get-Content $tablePath) {
                $w = @(($tl -replace '#.*$', '') -split '\s+' | Where-Object { $_ })
                if ($w.Count -ge 2) { $table[$w[0].ToLower()] = [pscustomobject]@{ Timeout = [bool](@($w[1..($w.Count - 1)] | Where-Object { $_ -match '^TIMEOUT(=|$)' }).Count); Known = [bool](@($w[1..($w.Count - 1)] | Where-Object { $_ -match '^KNOWNFAIL=' }).Count) } }
              }
            }
            Write-Host "expected-exit table: $($table.Count) programs"
            foreach ($n in $bundled) {
              if (-not $table.ContainsKey($n.ToLower())) { $fail += "$n is bundled but has no row in expected_exit.txt" }
            }
            $knownList = @()
            foreach ($n in ($table.Keys | Sort-Object)) {
              if (-not ($bundled | Where-Object { $_.ToLower() -eq $n })) { Write-Host "table row $n is not bundled: skipped"; continue }
              $m = [regex]::Match($text, '(?ms)^program=' + [regex]::Escape($n) + '\s*\r?\n(?:(?!^program=).)*?^verdict=([\w-]+)')
              if (-not $m.Success) { $fail += "no block for $n"; continue }
              $word = $m.Groups[1].Value
              if ($word -eq 'PASS') { continue }
              if ($word -eq 'TIMEOUT' -and $table[$n].Timeout) { continue }
              if ($word -eq 'KNOWN-FAIL' -and $table[$n].Known) { $knownList += $n; continue }
              $fail += "$n is $word, not PASS"
            }
            $counts = @{ PASS = 0; 'KNOWN-FAIL' = 0; FAIL = 0; EXITED = 0; TIMEOUT = 0; CRASH = 0 }
            foreach ($m in [regex]::Matches($text, '(?m)^verdict=([\w-]+)')) { $k = $m.Groups[1].Value; if ($counts.ContainsKey($k)) { $counts[$k]++ } }
            $countLine = "pass=$($counts.PASS) knownfail=$($counts['KNOWN-FAIL']) fail=$($counts.FAIL) exited=$($counts.EXITED) timeout=$($counts.TIMEOUT) crash=$($counts.CRASH)"
            Write-Host $countLine
            # The directory install ran as C:\guest\dirtree\bin\guest_dirtree.exe with cwd C:\guest\dirtree\data: its own checks all passed.
            $dm = [regex]::Match($text, '(?ms)^program=dirtree\s*\r?\n(?:(?!^program=).)*')
            if (-not $dm.Success) { $fail += 'no report block for the directory install dirtree' }
            elseif ($dm.Value -notmatch 'dirtree: all checks passed') { $fail += 'the dirtree block lacks "dirtree: all checks passed"' }
            elseif ($dm.Value -match 'dirtree: FAIL') { $fail += 'the dirtree block holds a "dirtree: FAIL" line' }
            # The Doom timedemo runs the whole demo (it exits through I_Error with -1, table label "timedemo"): its last frame is not black.
            $bmp = Join-Path $ls 'doom-timedemo.bmp'
            if (-not (Test-Path $bmp)) { $fail += 'doom-timedemo.bmp was not written' }
            else {
              $bytes = [System.IO.File]::ReadAllBytes($bmp)
              $seen = New-Object 'System.Collections.Generic.HashSet[uint32]'
              for ($i = 54; $i + 3 -lt $bytes.Length; $i += 4 * 997) { [void]$seen.Add([BitConverter]::ToUInt32($bytes, $i)) }
              Write-Host "doom-timedemo.bmp: $($bytes.Length) bytes, $($seen.Count) distinct sampled pixels"
              if ($seen.Count -lt 8) { $fail += 'doom-timedemo.bmp is black or flat' }
            }
          }
          $lines = @('### host-uwp launcher: Run every program (autoselect all)')
          if ($countLine) { $lines += "- $countLine" }
          if ($knownList.Count -gt 0) { $lines += "- KNOWN-FAIL (recorded, not PASS): $($knownList -join ', ')"; Write-Host "knownfail programs: $($knownList -join ', ')" }
          else { $lines += '- KNOWN-FAIL: none' }
          if ($fail.Count -eq 0) { $lines += '- PASS: every bundled program has a row in expected_exit.txt and is PASS (TIMEOUT only where the table says so); doom-timedemo.bmp is not black' }
          else { $fail | ForEach-Object { $lines += "- FAIL: $_"; Write-Host "::error::$_" } }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($fail.Count -gt 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: host-uwp-launcher-all-evidence
          path: uwp-evidence-all
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: host-uwp-launcher-evidence
          path: |
            uwp-evidence
            uwp-activate.rc
          if-no-files-found: ignore
          retention-days: 7
