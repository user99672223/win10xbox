name: ci

on:
  push:
    branches: ["**"]
    tags: ["m*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read   # the windows job downloads the wine-pe-builtin artifact

env:
  LLVM_MINGW_VER: "20250910"

jobs:
  # Fast cross-compile + Wine smoke run. NOT truth for the layer; catches
  # portability errors and gives a quick signal before the Windows job.
  linux-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Nested submodules we need (zycore only; speakeasy's test corpora are not needed)
        run: git submodule update --init --recursive third_party/zydis
      - name: Cache llvm-mingw
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: /opt/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VER }}-ucrt-ubuntu-22.04
      - name: Install llvm-mingw
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/llvm-mingw
          curl -sSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VER}/llvm-mingw-${LLVM_MINGW_VER}-ucrt-ubuntu-22.04-x86_64.tar.xz" \
            | sudo tar -xJ -C /opt/llvm-mingw --strip-components=1
      - name: Install Wine + ninja
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends wine wine64 ninja-build
      - name: Configure
        run: cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw.cmake
      - name: Build
        run: cmake --build build-mingw -- -k 0   # keep going so all errors surface
      # Give the guest end-to-end tests a real run under Wine: the Wine PE
      # builtins (from the wine-pe artifact) + the NLS data (from the Wine
      # prefix, which our emulated NtGetNlsSectionPtr serves). Without these the
      # guest tests skip; with them the full pipeline (boot -> printf -> exit) is
      # exercised and gated here. Non-fatal download: if absent, they skip.
      - name: Fetch wine-pe builtin DLLs (optional)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          id=$(gh run list --repo "${{ github.repository }}" --workflow wine-pe.yml --branch "${{ github.ref_name }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          [ -z "$id" ] && id=$(gh run list --repo "${{ github.repository }}" --workflow wine-pe.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$id" ]; then
            mkdir -p wine-pe/out/builtin
            gh run download "$id" --repo "${{ github.repository }}" --name wine-pe-builtin --dir wine-pe/out/builtin
            echo "downloaded wine-pe-builtin from run $id ($(ls wine-pe/out/builtin/*.dll 2>/dev/null | wc -l) DLLs)"
          else
            echo "no successful wine-pe run yet; guest tests will skip"
          fi
      - name: Init Wine prefix (must be a dir we own; /tmp is not)
        env: { WINEDEBUG: "-all", WINEPREFIX: "${{ runner.temp }}/wineprefix" }
        run: |
          wineboot --init
          wineserver -w
      - name: Stage Wine NLS data into the machine folder (for the guest e2e tests)
        env: { WINEPREFIX: "${{ runner.temp }}/wineprefix" }
        run: |
          sys32=build-mingw/bin/machine/Windows/System32
          sort=build-mingw/bin/machine/Windows/Globalization/Sorting
          mkdir -p "$sys32" "$sort"
          cp -f "$WINEPREFIX"/drive_c/windows/system32/*.nls "$sys32"/ 2>/dev/null || true
          cp -f /usr/share/wine/nls/*.nls "$sys32"/ 2>/dev/null || true
          cp -f "$sys32"/sortdefault.nls "$sort"/ 2>/dev/null || true
          echo "staged $(ls "$sys32"/*.nls 2>/dev/null | wc -l) NLS files"
      - name: Test under Wine
        env: { WINEDEBUG: "-all", WINEPREFIX: "${{ runner.temp }}/wineprefix" }
        # wine_conformance (Wine's own test subset) is a recorded fidelity
        # baseline, not a gate, and needs wine-pe/wine-src which this job does
        # not clone, so it skips here; exclude it from the gating run.
        run: ctest --test-dir build-mingw --output-on-failure --label-exclude wine_conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-cross-bin
          path: build-mingw/bin/
          retention-days: 3

  # The real Windows test machine: MSVC 2022, host-win32 runs core/ unsandboxed.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Nested submodules we need (zycore only; speakeasy's test corpora are not needed)
        run: git submodule update --init --recursive third_party/zydis
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      # Wine builtin DLLs from the latest successful wine-pe run. Non-fatal: if
      # none exists yet the guest integration tests skip (ntdll absent), so the
      # MSVC compile + unit tests still gate. Downloads into the default
      # WIN10XBOX_BUILTIN_DIR (wine-pe/out/builtin) so no -D is needed.
      - name: Fetch wine-pe builtin DLLs (optional)
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $id = gh run list --repo ${{ github.repository }} --workflow wine-pe.yml --branch ${{ github.ref_name }} --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if (-not $id) {
            $id = gh run list --repo ${{ github.repository }} --workflow wine-pe.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          }
          if ($id) {
            New-Item -ItemType Directory -Force -Path wine-pe/out/builtin | Out-Null
            gh run download $id --repo ${{ github.repository }} --name wine-pe-builtin --dir wine-pe/out/builtin
            Write-Host "downloaded wine-pe-builtin from run $id ($((Get-ChildItem wine-pe/out/builtin -Filter *.dll).Count) DLLs)"
          } else {
            Write-Host "no successful wine-pe run yet; guest integration tests will skip"
          }
      - name: Configure
        env: { SCCACHE_GHA_ENABLED: "true" }
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        env: { SCCACHE_GHA_ENABLED: "true" }
        run: cmake --build build -- -k 0   # keep going so all compile errors surface in one run
      - name: Populate machine folder from the runner's System32 (never committed)
        shell: pwsh
        run: ./machine/import_windows_dlls.ps1 -Source "$env:SystemRoot\System32" -Machine build/bin/machine -CI
      # Gate: everything except the end-to-end tests that depend on captured
      # guest stdout (labels guest_e2e and driver_e2e). The driver_e2e tests
      # boot a full guest through drv_host and assert on the guest's printed
      # output, so they inherit the same real-Windows stdout-capture gap.
      - name: Test
        env: { WIN10XBOX_DEBUG: "+all" }
        run: ctest --test-dir build --output-on-failure --timeout 300 --label-exclude "guest_e2e|driver_e2e|wine_conformance"
      # End-to-end on real Windows is in bring-up: the guest boots through the
      # full ntdll init and runs to completion (correct exit code), but its
      # stdio is not yet captured on a real-Windows host (works under Wine,
      # gated on linux-cross). The guest_e2e and driver_e2e tests assert on that
      # stdout, so run them for visibility without failing the job. See
      # docs/STATUS.md. (On MSVC only the WDM driver_ioctl is built; KMDF and the
      # layout check are NOT-MSVC-only.)
      - name: Test (end-to-end, real-Windows bring-up, non-blocking)
        continue-on-error: true
        env: { WIN10XBOX_DEBUG: "+all" }
        run: ctest --test-dir build --output-on-failure --timeout 300 --label-regex "guest_e2e|driver_e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.config }}-logs
          path: |
            build/Testing/Temporary/
            build/bin/*.log
            build/bin/crash.txt
            build/bin/*.bmp
          retention-days: 7
