name: ci

on:
  push:
    branches: ["**"]
    tags: ["m*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read   # the windows job downloads the wine-pe-builtin artifact

env:
  LLVM_MINGW_VER: "20250910"

jobs:
  # Fast cross-compile + Wine smoke run. NOT truth for the layer; catches
  # portability errors and gives a quick signal before the Windows job.
  linux-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Nested submodules we need (zycore only; speakeasy's test corpora are not needed)
        run: git submodule update --init --recursive third_party/zydis
      - name: Cache llvm-mingw
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: /opt/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VER }}-ucrt-ubuntu-22.04
      - name: Install llvm-mingw
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/llvm-mingw
          curl -sSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VER}/llvm-mingw-${LLVM_MINGW_VER}-ucrt-ubuntu-22.04-x86_64.tar.xz" \
            | sudo tar -xJ -C /opt/llvm-mingw --strip-components=1
      # apt on the runner can stall for hours on a dead mirror (run 39811598598 sat on this
      # step for 3 h 40 min): bound the step and retry the download phase.
      # The .deb downloads (libwine alone is 105 MB) are cached between runs: run 39869849063
      # spent its whole 12 minutes on that one file from a throttled mirror. A cache hit
      # makes the step install from local files; a miss downloads as before and saves.
      - name: Cache apt downloads
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-debs-${{ runner.os }}-noble-wine9-v1
      - name: Install Wine + ninja
        timeout-minutes: 25
        run: |
          mkdir -p "$HOME/apt-cache"
          sudo dpkg --add-architecture i386
          for i in 1 2 3; do sudo apt-get update -q && break; sleep 15; done
          # A throttled mirror stalls the 105 MB libwine download (run 39876423114 sat on it for the whole
          # 12 minutes): three attempts of at most 7 minutes each, a partial download is resumed by the next.
          ok=0
          for i in 1 2 3; do
            if sudo timeout 420 apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
                 -o Dir::Cache::archives="$HOME/apt-cache" wine wine64 ninja-build pulseaudio; then ok=1; break; fi
            echo "apt-get install attempt $i failed"
            # The Azure mirror is the usual culprit (run 39982478666 lost the 105 MB libwine twice): switch every
            # apt source to the main archive before the next attempt and refresh the index once.
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            sudo apt-get update -q || true
            sleep 10
          done
          [ "$ok" = 1 ]
          # Leave only the .deb files for the cache (lock and partial/ are root-owned).
          sudo rm -rf "$HOME/apt-cache/lock" "$HOME/apt-cache/partial"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-cache"
      # The Wine sources, for the wine_conformance subset (Wine's own tests built
      # as guests, tests/wine-tests): a shallow clone of the pinned tag plus
      # wine-pe/patches, about a minute. Before Configure: CMake decides there
      # whether the conformance guests can be built.
      - name: Fetch the Wine sources (wine_conformance guests)
        run: wine-pe/fetch-wine.sh
      # Give the guest end-to-end tests a real run under Wine: the Wine PE
      # builtins (from the wine-pe artifact) + the NLS data (from the Wine
      # prefix, which our emulated NtGetNlsSectionPtr serves). MANDATORY: without
      # the builtins every guest test would skip, so the job fails instead
      # (tools/ci/fetch_wine_pe.py; it waits for a wine-pe run of this commit).
      # wine-pe-include holds the widl-generated headers advapi32/registry needs.
      - name: Fetch wine-pe builtin DLLs and generated headers (required)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: >
          python3 -I tools/ci/fetch_wine_pe.py --repo "${{ github.repository }}" --branch "${{ github.ref_name }}"
          --sha "${{ github.sha }}" --artifact wine-pe-builtin=wine-pe/out/builtin
          --artifact wine-pe-include=wine-pe/build/include
      - name: Configure
        run: cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw.cmake
      - name: Build
        run: cmake --build build-mingw -- -k 0   # keep going so all errors surface
      - name: Init Wine prefix (must be a dir we own; /tmp is not)
        env: { WINEDEBUG: "-all", WINEPREFIX: "${{ runner.temp }}/wineprefix" }
        run: |
          wineboot --init
          wineserver -w
      # A virtual audio device for the Wine host (docs/slices/audio.md): PulseAudio with a null sink, which Wine's winepulse
      # driver turns into the default render endpoint. The layer's audio tests compare the layer with the host, so with
      # this the host plays the sound and so must the layer; if the daemon does not come up the host has no endpoint and
      # the same tests assert the exact no-endpoint path.
      - name: Start a virtual audio device (PulseAudio null sink) for the Wine host
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo mkdir -p "$XDG_RUNTIME_DIR" && sudo chown "$(id -u):$(id -g)" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1 --disallow-exit --load="module-null-sink sink_name=virtual" || true
          sleep 2
          pactl info || true
          pactl list short sinks || true
      - name: Stage Wine NLS data into the machine folder (for the guest e2e tests)
        env: { WINEPREFIX: "${{ runner.temp }}/wineprefix" }
        run: |
          sys32=build-mingw/bin/machine/Windows/System32
          sort=build-mingw/bin/machine/Windows/Globalization/Sorting
          mkdir -p "$sys32" "$sort"
          cp -f "$WINEPREFIX"/drive_c/windows/system32/*.nls "$sys32"/ 2>/dev/null || true
          cp -f /usr/share/wine/nls/*.nls "$sys32"/ 2>/dev/null || true
          cp -f "$sys32"/sortdefault.nls "$sort"/ 2>/dev/null || true
          echo "staged $(ls "$sys32"/*.nls 2>/dev/null | wc -l) NLS files"
      # Everything, wine_conformance included: those tests gate on the recorded
      # baseline (tests/wine-tests/baseline.cmake: a regression fails, an
      # improvement passes with an IMPROVED note), about 3.5 minutes.
      - name: Test under Wine
        env: { WINEDEBUG: "-all", WINEPREFIX: "${{ runner.temp }}/wineprefix" }
        run: ctest --test-dir build-mingw --output-on-failure --timeout 300 --output-junit ctest-junit.xml
      # ctest counts a skipped test as passed ("100% tests passed" with every
      # guest test skipped: docs/HANDOFF.md trap 1). Fail on any test that did
      # not run, and on a label that has fewer tests than its floor.
      - name: Gate - nothing skipped
        if: ${{ !cancelled() }}
        run: >
          python3 -I tools/ci/check_ctest_run.py --build build-mingw --junit ctest-junit.xml
          --require-label guest_e2e --require-label driver_e2e=2 --require-label drivers=2
          --require-label wine_conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-cross-bin
          # Testing/Temporary holds every test's full output (ctest shows a passing test's output nowhere else);
          # winetest/<dll>/ holds the Wine conformance suites' per-unit logs and .tsv rows (wine-pe/tests/*.sh).
          path: |
            build-mingw/bin/
            build-mingw/Testing/Temporary/
            build-mingw/winetest/
          retention-days: 3

  # The real Windows test machine: MSVC 2022, host-win32 runs core/ unsandboxed.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Nested submodules we need (zycore only; speakeasy's test corpora are not needed)
        run: git submodule update --init --recursive third_party/zydis
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      # Wine builtin DLLs, MANDATORY (tools/ci/fetch_wine_pe.py: a wine-pe run of
      # this commit if there is one, waited for; else the newest successful one
      # that still has the artifact; every query retried). Without them every
      # guest test skips: ci.yml run 39818491081's windows (Debug) job found no
      # run ("no successful wine-pe run yet") while its RelWithDebInfo sibling
      # did, and went green with all 14 end-to-end tests skipped. Downloads into
      # the default WIN10XBOX_BUILTIN_DIR (wine-pe/out/builtin).
      - name: Fetch wine-pe builtin DLLs (required)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: >
          python -I tools/ci/fetch_wine_pe.py --repo "${{ github.repository }}" --branch "${{ github.ref_name }}"
          --sha "${{ github.sha }}" --artifact wine-pe-builtin=wine-pe/out/builtin
      # Wine's own ntdll conformance tests (dlls/ntdll/tests) as ONE guest, ntdll_test.exe, run through the
      # layer by integration.winetest_ntdll on the allowlist wine-pe/tests/ntdll.allowlist (docs/slices/wt-ntdll.md).
      # MSVC cannot build them, so llvm-mingw's Windows build does (wine-pe/tests/ntdll.sh, from Git Bash), against
      # Wine's headers from the pinned source tree (wine-pe/fetch-wine.sh: a shallow clone, patches applied). Before
      # Configure: the test is registered where build/winetest/ntdll/ntdll_test.exe exists.
      - name: Install llvm-mingw (Windows build, for the Wine ntdll test guest)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "llvm-mingw.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VER/llvm-mingw-$env:LLVM_MINGW_VER-ucrt-x86_64.zip"
          for ($i = 1; $i -le 3; $i++) {
            curl.exe -sSL --fail --retry 3 -o $zip $url
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          if ($LASTEXITCODE -ne 0) { throw "llvm-mingw download failed" }
          $dir = Join-Path $env:RUNNER_TEMP "llvm-mingw-x"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          tar.exe -xf $zip -C $dir
          if ($LASTEXITCODE -ne 0) { throw "llvm-mingw extract failed" }
          $root = (Get-ChildItem $dir -Directory | Select-Object -First 1).FullName
          Write-Host "llvm-mingw at $root"
          "LLVM_MINGW_WIN=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Wine's ntdll conformance guest (ntdll_test.exe)
        shell: bash
        env:
          # Git for Windows would check Wine out with CRLF and translate its patches' context.
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: "true"
          # clang's mingw driver does not read these, but they point at MSVC's headers.
          INCLUDE: ""
          LIB: ""
        run: |
          export LLVM_MINGW="$(cygpath -u "$LLVM_MINGW_WIN")"
          wine-pe/fetch-wine.sh
          wine-pe/tests/ntdll.sh build --out build/winetest/ntdll
          ls -l build/winetest/ntdll
      # The WDK's km headers (ntddk.h), which this image does not have, from the
      # pinned NuGet package (tools/ci/fetch_wdk_km.ps1): tests/drivers builds the
      # KMDF driver, its client and drivers.layout against them with MSVC.
      - name: Cache the WDK km headers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wdk
          key: wdk-km-10.0.26100.6584
      - name: Fetch the WDK km headers (required)
        shell: pwsh
        run: ./tools/ci/fetch_wdk_km.ps1
      # Dear ImGui's release source for guest_imgui_d3d11 (tests/guest/imgui_d3d11.cpp wraps its unmodified
      # example_win32_directx11; docs/DECISIONS.md G1). Not vendored; CMake reads WIN10XBOX_IMGUI_DIR at configure.
      - name: Fetch Dear ImGui (guest_imgui_d3d11)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'imgui'
          for ($i = 1; $i -le 4; $i++) {
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
            git clone -q --depth 1 --branch v1.93.0 https://github.com/ocornut/imgui $dir
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not (Test-Path "$dir/examples/example_win32_directx11/main.cpp")) { throw "Dear ImGui v1.93.0 not fetched" }
          "WIN10XBOX_IMGUI_DIR=$dir" >> $env:GITHUB_ENV
      - name: Configure
        env: { SCCACHE_GHA_ENABLED: "true" }
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DWIN10XBOX_DDK_INCLUDE="$env:WDK_KM"
      - name: Build
        env: { SCCACHE_GHA_ENABLED: "true" }
        run: cmake --build build -- -k 0   # keep going so all compile errors surface in one run
      - name: Populate machine folder from the runner's System32 (never committed)
        shell: pwsh
        run: ./machine/import_windows_dlls.ps1 -Source "$env:SystemRoot\System32" -Machine build/bin/machine -CI
      # The natives only the Direct3D machine folder gets (machine/guest_dlls_d3d.txt), kept out of the shared machine folder.
      - name: Stage the Direct3D machine's extra natives
        shell: pwsh
        run: ./machine/import_windows_dlls.ps1 -Source "$env:SystemRoot\System32" -Machine build/bin/machine-d3d-extra -CI -ListFile machine/guest_dlls_d3d.txt
      # A real program that is not ours: 7-Zip 24.09's 7zr.exe from the official source tarball (pinned SHA-256, the
      # cache key carries it), nmake in CPP/7zip/Bundles/Alone7z -> build/bin/machine/guest/7zr.exe; run by
      # integration.real7z (tests/integration/real7z.cmake).
      - name: Cache the 7-Zip source tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sevenzip-src
          key: sevenzip-24.09-49c05169f49572c1128453579af1632a952409ced028259381dac30726b6133a
      - name: Build 7-Zip 7zr.exe (real guest program)
        shell: pwsh
        run: ./tools/ci/build_7zip.ps1 -Out build/bin/machine/guest

      # A real program that is not ours: the SQLite command-line shell, from the official amalgamation pinned by URL and
      # SHA-256 (verified on every run, cached or not), compiled with cl /O2 /MT into the machine folder's guest
      # directory. integration.sqlite_* and the smoke step below run it; the build fails if the archive changes.
      - name: Cache the SQLite amalgamation
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sqlite-download
          key: sqlite-amalgamation-3540100-0a9c8e34352dad46006aa82836d5383bff9dc6bc9ce5a60553c05aa30e6ad1f9
      - name: Build the SQLite shell (pinned, SHA-256 verified)
        shell: pwsh
        run: ./tools/ci/build_sqlite.ps1 -OutDir build/bin/machine/guest
      # The first program that is not ours: Lua 5.4.7, built from the upstream tarball (pinned SHA-256, checked on
      # every run, restored from the cache or downloaded) with cl /O2 /MT into build/bin/machine/guest/lua.exe;
      # the Test and Smoke steps below run it (integration.lua_*, docs/STATUS.md "Real programs").
      - name: Cache the Lua source tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lua-src
          key: lua-5.4.7-9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30
      - name: Build Lua 5.4.7 (real guest program)
        shell: pwsh
        run: ./tools/ci/build_lua.ps1 -Out build/bin/machine/guest
      # The official CPython 3.12 embeddable package from python.org (pinned SHA-256, checked on every run), unpacked
      # unchanged into build/bin/machine/guest/python; the Test step runs it (integration.real_python_platform, integration.real_python_json).
      - name: Cache the Python embeddable zip
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/python-embed
          key: python-3.12.10-embed-amd64-4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
      - name: Fetch Python 3.12 embeddable (real guest program)
        shell: pwsh
        run: ./tools/ci/fetch_python.ps1 -Out build/bin/machine/guest/python
      # Two more programs that are not ours: Sysinternals Coreinfo64.exe and PsInfo64.exe, downloaded from
      # live.sysinternals.com and pinned by SHA-256 (tools/ci/fetch_sysinternals.ps1, verified on every run). Left in
      # build/bin/machine/guest for integration.coreinfo / integration.psinfo (docs/slices/sysinfo.md).
      - name: Cache the Sysinternals tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sysinternals
          key: sysinternals-coreinfo-4be1e87e-psinfo-983270da
      - name: Fetch Sysinternals Coreinfo64 and PsInfo64 (real guest programs)
        shell: pwsh
        run: ./tools/ci/fetch_sysinternals.ps1 -Out build/bin/machine/guest
      # The second real program, and the first prebuilt one: fastfetch 2.70.0, the project's official release zip
      # (tools/ci/fetch_fastfetch.ps1: pinned SHA-256, verified on every run, restored from the cache or downloaded),
      # left at build/bin/machine/guest/fastfetch.exe for integration.fastfetch (docs/slices/fastfetch.md).
      - name: Cache the fastfetch release zip
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fastfetch-src
          key: fastfetch-2.70.0-89e5a20f46ac04b154c7d0ea13dbac97e43f799a98d7ae4c598863ba357a8c7f
      - name: Fetch fastfetch 2.70.0 (real guest program)
        shell: pwsh
        run: ./tools/ci/fetch_fastfetch.ps1 -Out build/bin/machine/guest
      # Tiny C Compiler 0.9.27, the official prebuilt win64 zip (tools/ci/fetch_tcc.ps1: pinned SHA-256, verified on
      # every run, restored from the cache or downloaded), left in build/bin/machine/guest/tcc for integration.tcc_*
      # (docs/slices/realtcc.md): the compiler runs through the layer, and so does the exe it produces.
      - name: Cache the Tiny C Compiler zip
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tcc-src
          key: tcc-0.9.27-win64-34a721949a2583fdff725312da092fa0f5f1f284b702e6f811c6954714faabb2
      - name: Fetch Tiny C Compiler 0.9.27 (real guest program)
        shell: pwsh
        run: ./tools/ci/fetch_tcc.ps1 -Out build/bin/machine/guest/tcc
      # The third prebuilt program: ninja 1.12.1, the project's official ninja-win.zip (tools/ci/fetch_ninja.ps1: pinned
      # SHA-256, verified on every run), left at build/bin/machine/guest/ninja.exe for integration.ninja_*
      # (docs/slices/realninja.md). Its build rules run the lua.exe built above.
      - name: Cache the ninja release zip
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ninja-src
          key: ninja-1.12.1-f550fec705b6d6ff58f2db3c374c2277a37691678d6aba463adcbb129108467a
      - name: Fetch ninja 1.12.1 (real guest program)
        shell: pwsh
        run: ./tools/ci/fetch_ninja.ps1 -Out build/bin/machine/guest
      # The first game that is not ours: Chocolate Doom 3.1.1 (the project's official win64 zip: chocolate-doom.exe and the
      # SDL2 DLLs) with the shareware doom1.wad, both pinned by SHA-256 and verified on every run (tools/ci/fetch_doom.ps1).
      # Left in build/bin/machine/guest for integration.doom_timedemo (docs/slices/doom.md); its screenshot,
      # build/bin/doom_timedemo.bmp, is uploaded with the other *.bmp files.
      - name: Cache Chocolate Doom and doom1.wad
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/doom-src
          key: doom-3.1.1-58c34c61ae954493fce5ff01fd553898240a0de25658aa97b43ac9510c49581f-wad-1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771
      - name: Fetch Chocolate Doom 3.1.1 and doom1.wad (real guest program)
        shell: pwsh
        run: ./tools/ci/fetch_doom.ps1 -Out build/bin/machine/guest
      # Real GUI programs that are not ours (tools/ci/build_realgui.ps1): Microsoft's LearnWin32 Hello World and PuTTY
      # 0.85 (official tarball, cmake + cl /MT), pinned by SHA-256 and verified on every run. Left in
      # build/bin/machine/guest for integration.realgui_* (docs/TESTING.md, "Real GUI programs").
      - name: Cache the real GUI program sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/realgui-src
          key: realgui-putty-0.85-hellowin-a9946444
      - name: Build real GUI programs (PuTTY, Hello World)
        shell: pwsh
        run: ./tools/ci/build_realgui.ps1 -Out build/bin/machine/guest
      # A real SDL2 program: the OFFICIAL SDL2 2.30.9 x64 prebuilt release (pinned SHA-256, verified on every run),
      # sdl_rects.exe compiled against it with cl /MT; SDL2.dll is left next to it in build/bin/machine/guest
      # for integration.real_sdl2 (docs/slices/realsdl.md).
      - name: Cache the SDL2 release zip
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl2-src
          key: sdl2-devel-2.30.9-8c91d91e5bcb997d062ec2b553c53832ebf95654d4aa35e8c02a954d4ce752ae
      - name: Build the SDL2 guest (SDL2 2.30.9 prebuilt, pinned)
        shell: pwsh
        run: ./tools/ci/build_sdl_guest.ps1 -Out build/bin/machine/guest
      # curl 8.11.1's curl.exe from the release tarball (pinned SHA-256, checked on every run; the cache key carries
      # it), CMake + MSVC, no TLS -> build/bin/machine/guest/curl.exe; run by integration.real_curl_* (--version and
      # file:// reads, no network).
      - name: Cache the curl source tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/curl-src
          key: curl-8.11.1-a889ac9dbba3644271bd9d1302b5c22a088893719b72be3487bc3d401e5c4e80
      - name: Build curl.exe (real guest program, no TLS)
        shell: pwsh
        run: ./tools/ci/build_curl.ps1 -Out build/bin/machine/guest
      # Git for Windows (MinGit 2.47.1 x64 zip, pinned by SHA-256, verified on every run, cached or not), unpacked into
      # build/bin/machine/guest/mingit for integration.real_git* (tools/ci/fetch_mingit.ps1).
      - name: Cache the MinGit zip
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mingit-download
          key: mingit-2.47.1-50b04b55425b5c465d076cdb184f63a0cd0f86f6ec8bb4d5860114a713d2c29a
      - name: Fetch MinGit (real guest program, pinned SHA-256 verified)
        shell: pwsh
        run: ./tools/ci/fetch_mingit.ps1 -Out build/bin/machine/guest/mingit
      # A virtual render endpoint (docs/slices/xaudio2play.md): the pinned, hash-verified Scream 4.0 driver, else VB-CABLE,
      # installed with the vendor's own installer. It counts only when guest_wasapi, run directly on this host, plays (exit
      # 42); then WIN10XBOX_CI_AUDIO_ENDPOINT=1 is exported, which makes integration.guest_wasapi / guest_xaudio2 /
      # guest_xaudio2_native require "RESULT played" instead of accepting the no-endpoint answer (43). Fails the job
      # with the exact error of each attempt when no device can be installed.
      - name: Install a virtual audio render endpoint
        shell: pwsh
        timeout-minutes: 12
        run: ./tools/ci/install_virtual_audio.ps1 -Probe build/bin/guest/guest_wasapi.exe
      # What audio the runner has (docs/slices/audio.md): the services, the endpoint devices, and the verdict of the two
      # audio guests run directly on the host (42 = a device played the sound, 43 = no render endpoint, with the
      # HRESULT). integration.guest_wasapi / guest_xaudio2 require the layer to answer exactly as the host does, so
      # whichever the runner has, this step is the evidence of which one the gate checked. If the Windows Audio service
      # is stopped it is started once and the probe repeated (a normal service start, no device is added).
      - name: Probe - the runner's audio endpoints
        shell: pwsh
        run: |
          function Show-Audio($title) {
            Write-Host "=== $title ==="
            Get-Service Audiosrv, AudioEndpointBuilder -ErrorAction Continue | Format-Table Name, Status, StartType | Out-String | Write-Host
            Get-PnpDevice -PresentOnly -ErrorAction SilentlyContinue | Where-Object { $_.Class -in 'AudioEndpoint', 'MEDIA' } |
              Format-Table Status, Class, FriendlyName | Out-String | Write-Host
            Get-CimInstance Win32_SoundDevice -ErrorAction Continue | Format-List Name, Status | Out-String | Write-Host
            foreach ($g in 'guest_wasapi', 'guest_xaudio2') {
              $out = & "build/bin/guest/$g.exe" 2>&1 | Out-String
              Write-Host ("{0} run directly on the host: exit {1}`n{2}" -f $g, $LASTEXITCODE, $out)
            }
          }
          Show-Audio 'audio before'
          $svc = Get-Service Audiosrv -ErrorAction SilentlyContinue
          if ($svc -and $svc.Status -ne 'Running') {
            try { Start-Service Audiosrv -ErrorAction Stop; Start-Sleep -Seconds 3 } catch { Write-Host "Start-Service Audiosrv: $_" }
            Show-Audio 'audio after Start-Service Audiosrv'
          }
          exit 0   # the probe reports; the gates are integration.guest_wasapi / guest_xaudio2 and the fastfetch Sound module
      - name: Import table of the runner's native xaudio2_9.dll
        shell: pwsh
        continue-on-error: true
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'xa2imports'
          New-Item -ItemType Directory -Force $d | Out-Null
          python tools/game/dump_imports.py C:\Windows\System32\xaudio2_9.dll $d
          Get-Content "$d\*_imports.txt" | Select-String -NotMatch 'api-ms-win-core|api-ms-win-crt' | ForEach-Object { $_.Line }
      # The whole suite, end-to-end included. The guest's stdout IS captured on
      # real Windows: run 39818491081 (RelWithDebInfo, the one job of that run
      # that had the builtins) printed "hello from guest" and passed 11 of 13
      # guest_e2e tests; the two failures were real bugs, fixed since
      # (docs/STATUS.md). wine_conformance needs clang-built guests and the Wine
      # sources; with MSVC its tests are not registered at all. The one Wine suite
      # that does run here is ntdll's, built by the step above (winetest_ntdll).
      - name: Test
        env: { WIN10XBOX_DEBUG: "+all" }
        run: ctest --test-dir build --output-on-failure --timeout 300 --output-junit ctest-junit.xml
      - name: Gate - nothing skipped
        if: ${{ !cancelled() }}
        run: >
          python -I tools/ci/check_ctest_run.py --build build --junit ctest-junit.xml
          --require-label guest_e2e --require-label driver_e2e=2 --require-label drivers=2
          --require-label winetest_ntdll
      # What integration.winetest_ntdll measured: the allowlist gate's table, and the todo list of the units
      # that are not on it (the same text as docs/slices/wt-ntdll.md).
      - name: Wine ntdll conformance summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $f = "build/winetest/ntdll/results/summary.md"
          if (Test-Path $f) { Get-Content $f; Get-Content $f | Add-Content $env:GITHUB_STEP_SUMMARY } else { Write-Host "no $f" }
      # Every guest the build bundles (tests/guest, the host-uwp-lite smoke guest
      # in both subsystems, the driver clients through drv_host), run through
      # the host executables with the exit code each must return, read from the
      # process itself.
      - name: Smoke - every bundled guest through the host
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tools/ci/smoke_guests.ps1 -Bin build/bin -Machine build/bin/machine -LogDir build/guest-smoke -RealPrograms -Sysinternals
      # fastfetch module by module on the console's DLL set, gating: one process per module, so a module that stops the
      # guest fails by name. Each module that works must exit 0 and print its line. The ones that do not yet (Display,
      # GPU, Packages, LocalIp, Battery, Bluetooth) are the todo list of docs/slices/fastfetch.md; Sound is gated here since
      # the audio slice (docs/slices/audio.md).
      - name: Gate - fastfetch, each working module prints its line
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # Sound lists the active render endpoints: a line when the runner has one (what guest_wasapi run directly on the
          # host says, docs/slices/audio.md), and exit 0 with none otherwise; before the layer had mmdevapi it died
          # with 1722 (the MMDeviceEnumerator class was not registered).
          $null = & build/bin/guest/guest_wasapi.exe 2>&1
          $hostAudio = ($LASTEXITCODE -eq 42)
          Write-Host "host audio endpoint: $hostAudio (guest_wasapi exit $LASTEXITCODE)"
          $expect = [ordered]@{ OS = '^OS: '; Host = '^Host: '; Kernel = '^Kernel: WIN32_NT 10\.0\.19045'; Uptime = '^Uptime: '; Shell = '^Shell: ';
                                Terminal = '^Terminal: '; CPU = '^CPU: '; Memory = '^Memory: '; Swap = '^Swap: ';
                                Disk = '^Disk \(.*\): '; Locale = '^Locale: '; Sound = $(if ($hostAudio) { '^Sound' } else { '' }) }
          $machine = (Resolve-Path build/bin/machine-builtin).Path
          $fail = 0
          foreach ($m in $expect.Keys) {
            $o = "ff-$m.out"; $e = "ff-$m.err"
            $p = Start-Process build/bin/win10xbox.exe -ArgumentList '--machine', $machine, 'C:\guest\fastfetch.exe', '--pipe', '--logo', 'none', '-s', $m `
                   -RedirectStandardOutput $o -RedirectStandardError $e -PassThru -NoNewWindow
            $null = $p.Handle
            if (-not $p.WaitForExit(120000)) { $p.Kill(); $p.WaitForExit(); Write-Host "::error::fastfetch[$m]: killed after 120 s"; $fail = 1; continue }
            $text = (Get-Content $o -Raw); if ($null -eq $text) { $text = '' }
            Write-Host ("fastfetch[{0}]: exit {1}: {2}" -f $m, $p.ExitCode, ($text -replace "\r?\n", ' | '))
            if ($p.ExitCode -ne 0 -or $text -notmatch "(?m)$($expect[$m])") {
              Write-Host "::error::fastfetch[$m]: exit $($p.ExitCode), expected 0 and a line matching $($expect[$m])"
              Select-String -Path $e -Pattern 'err:|fixme:|FATAL|CRASH|unresolved import|exception:' | Select-Object -First 8 | ForEach-Object { Write-Host "    $($_.Line)" }
              $fail = 1
            }
          }
          # no endpoint on the host: Sound must print nothing (the layer answers E_NOTFOUND, fastfetch skips the module)
          if (-not $hostAudio -and (Get-Content ff-Sound.out -Raw) -match '(?m)^Sound') { Write-Host "::error::fastfetch[Sound]: a Sound line without a host endpoint"; $fail = 1 }
          # guest_wasapi's 43 (no endpoint) must not leak out as the step's exit code
          $global:LASTEXITCODE = 0
          if ($fail) { exit 1 }
          exit 0
      # crash.txt / crash.dmp / entry-reached.txt: what host-win32/crash.cpp writes into build/bin when a guest run
      # (ctest or the smoke step) dies; *.bmp: the GUI tests' screenshots (WIN10XBOX_SCREENSHOT).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.config }}-logs
          path: |
            build/Testing/Temporary/
            build/ctest-junit.xml
            build/winetest/ntdll/results/
            build/guest-smoke/
            build/bin/*.log
            build/bin/crash.txt
            build/bin/crash.dmp
            build/bin/entry-reached.txt
            build/bin/*.bmp
            build/bin/guest/guest_lockfile.*
            build/bin/guest/sqlite3.exe
          retention-days: 7
