name: dev-setup-check

# Evidence that the owner's one command works (docs/dev/WINDOWS-AGENTS.md): on a clean windows-latest, from an EMPTY
# directory (no checkout), fetch tools/dev/setup-windows-agents.ps1 from the branch and run it with -SkipInstall under
# Windows PowerShell 5.1. It clones the branch, preps, configures, builds, runs the whole ctest suite and the skip gate.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to clone and to take the script from
        default: claude/youthful-cerf-l7xxsb
  push:
    branches: ["claude/youthful-cerf-l7xxsb-devsetup"]   # slice branch only; removed before status: ready

permissions:
  contents: read
  actions: read   # gh run download of the wine-pe artifacts

concurrency:
  group: dev-setup-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      SETUP_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      # The one thing the owner's machine needs that a runner lacks; the winget path is not exercised here.
      - name: Claude Code CLI (npm, as the script would do without -SkipInstall)
        shell: powershell
        run: |
          npm install -g @anthropic-ai/claude-code
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
      - name: Empty directory, script from the branch, run it
        shell: powershell
        run: |
          $empty = Join-Path $env:RUNNER_TEMP 'empty-folder'
          New-Item -ItemType Directory -Force -Path $empty | Out-Null
          Set-Location $empty
          "PSVersion $($PSVersionTable.PSVersion); cwd $((Get-Location).Path); entries: $(@(Get-ChildItem -Force).Count)"
          gh api -H "Accept: application/vnd.github.raw" "repos/$env:GITHUB_REPOSITORY/contents/tools/dev/setup-windows-agents.ps1?ref=$env:SETUP_BRANCH" |
            Out-File -Encoding ascii setup-windows-agents.ps1
          if (-not (Test-Path setup-windows-agents.ps1) -or (Get-Item setup-windows-agents.ps1).Length -lt 1000) { throw "could not fetch the script from $env:SETUP_BRANCH" }
          .\setup-windows-agents.ps1 -SkipInstall -Branch $env:SETUP_BRANCH -Repo $env:GITHUB_REPOSITORY
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-setup-check-logs
          path: |
            ${{ runner.temp }}/empty-folder/win10xbox/build/ctest-junit.xml
            ${{ runner.temp }}/empty-folder/win10xbox/build/Testing/Temporary/
            ${{ runner.temp }}/empty-folder/win10xbox/build/bin/*.log
            ${{ runner.temp }}/empty-folder/win10xbox/build/bin/crash.txt
          retention-days: 7
